<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22. 括号生成 · DFS 回溯可视化</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e;
    --blue:#58a6ff; --green:#3fb950; --orange:#d29922; --red:#f85149;
    --purple:#bc8cff; --done:#2f6b45;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;
  }
  header h1{font-size:15px;font-weight:600}
  header .sub{color:var(--muted);font-size:12px}
  .controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  .btn{
    background:var(--panel2);color:var(--fg);border:1px solid var(--border);
    padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;
    font-family:var(--mono);transition:.15s;
  }
  .btn:hover{background:#272e3a;border-color:#444c56}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btn.primary:hover{background:#388bfd}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{
    background:var(--panel2);color:var(--muted);border:none;padding:6px 12px;
    cursor:pointer;font-family:var(--mono);font-size:13px;
  }
  .seg button.on{background:#1f6feb;color:#fff}
  select{
    background:var(--panel2);color:var(--fg);border:1px solid var(--border);
    padding:6px 8px;border-radius:6px;font-family:var(--mono);
  }
  /* 进度条 */
  .progress-bar{
    display:flex;align-items:center;gap:12px;padding:7px 18px;
    background:var(--panel);border-bottom:1px solid var(--border);
  }
  .progress-bar input[type=range]{
    flex:1;accent-color:#1f6feb;cursor:pointer;height:22px;
  }
  .progress-bar .pl{
    font-family:var(--mono);font-size:11px;color:var(--muted);min-width:74px;
  }
  main{
    flex:1;display:grid;gap:10px;padding:10px 14px;
    grid-template-columns:1.45fr 1fr;min-height:0;
  }
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .panel-head{
    padding:8px 12px;border-bottom:1px solid var(--border);
    font-size:12px;color:var(--muted);font-family:var(--mono);
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:var(--panel2);
  }
  #treeWrap{flex:1;overflow:auto;position:relative;padding:10px;scroll-behavior:smooth}
  #treeSvg{display:block}
  .rightCol{display:flex;flex-direction:column;gap:10px;min-height:0}
  .state-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .tmp-display{
    font-family:var(--mono);font-size:32px;font-weight:600;
    text-align:center;padding:12px 8px;letter-spacing:3px;
    background:var(--panel2);border-radius:8px;min-height:62px;
    border:1px solid var(--border);
  }
  .tmp-display .empty{color:#3d444d;font-size:16px;letter-spacing:0}
  .tmp-display span{display:inline-block}
  .tmp-display span.new{animation:charIn .3s ease}
  @keyframes charIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .counters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .counter{
    background:var(--panel2);border-radius:6px;padding:8px;text-align:center;
    border:1px solid var(--border);
  }
  .counter .lbl{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .counter .val{font-size:20px;font-weight:700;font-family:var(--mono);margin-top:2px}
  .counter.l .val{color:var(--blue)}
  .counter.r .val{color:var(--orange)}
  .depth-box{background:var(--panel2);border-radius:6px;padding:8px 10px;border:1px solid var(--border)}
  .depth-box .lbl{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:5px}
  .depth-track{display:flex;gap:3px}
  .depth-cell{flex:1;height:8px;border-radius:2px;background:#272e3a}
  .depth-cell.on{background:var(--blue)}
  .desc{
    background:var(--panel2);padding:10px 12px;border-radius:6px;
    border-left:3px solid var(--blue);font-size:13px;line-height:1.6;
  }
  .desc.warn{border-left-color:var(--orange)}
  .desc.bad{border-left-color:var(--red)}
  .desc.ok{border-left-color:var(--green)}
  #codeBody{padding:8px 0;font-family:var(--mono);font-size:12.5px;overflow:auto;flex:1}
  .code-line{display:flex;padding:2px 12px;white-space:pre;min-height:19px;color:#c9d1d9}
  .code-line .ln{width:26px;color:#484f58;user-select:none;text-align:right;margin-right:12px;flex-shrink:0}
  .code-line.cur{background:rgba(56,139,253,.15);border-left:2px solid var(--blue);padding-left:10px}
  .kw{color:#ff7b72}.ty{color:#ffa657}.fn{color:#d2a8ff}.nm{color:#79c0ff}
  #answers{
    grid-column:1/-1;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:44px;
  }
  #answers .lbl{color:var(--muted);font-family:var(--mono);font-size:12px;margin-right:4px}
  .ans-chip{
    font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:4px;
    background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.3);
    animation:pop .3s ease;
  }
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .legend{display:flex;gap:10px;font-size:11px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .node{cursor:pointer}
  .node text{font-family:var(--mono)}
  .edge{stroke:#3d444d;stroke-width:1.5;fill:none}
  .edge.done{stroke:var(--done);opacity:.65}
  .edge.cur{stroke:var(--blue);stroke-width:2.5}
  .edge.back{stroke:var(--orange);stroke-width:2.5}
  .edge.prune{stroke:#f85149;stroke-dasharray:4 4;opacity:.55}
  .edge.prune.cur{stroke:#f85149;stroke-width:2.5;opacity:1}
  .stats{display:flex;gap:10px;font-family:var(--mono);font-size:11px}
  .stats b{color:var(--fg)}
  @media(max-width:900px){
    main{grid-template-columns:1fr;overflow:auto}
    body{overflow:auto}
    .panel{min-height:280px}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>22. 括号生成 <span style="color:var(--muted);font-weight:400">| DFS 回溯 + 剪枝</span></h1>
    <div class="sub">点击树上任意节点可直接跳转 · 红色虚线 = 剪枝 · 暗绿 = 已探索完的分支</div>
  </div>
  <div class="controls">
    <div class="seg" id="nSeg">
      <button data-n="2">n=2</button>
      <button data-n="3" class="on">n=3</button>
      <button data-n="4">n=4</button>
    </div>
    <button class="btn" id="btnReset">⟲ 重置</button>
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <select id="speed">
      <option value="1400">慢</option>
      <option value="800" selected>中</option>
      <option value="350">快</option>
    </select>
  </div>
</header>

<div class="progress-bar">
  <span class="pl" id="plLabel">步骤 0 / 0</span>
  <input type="range" id="slider" min="0" max="1" value="0">
</div>

<main>
  <div class="panel">
    <div class="panel-head">
      <span>递归调用树</span>
      <div class="stats" id="stats"></div>
    </div>
    <div id="treeWrap"><svg id="treeSvg"></svg></div>
    <div class="panel-head" style="border-top:1px solid var(--border);border-bottom:none">
      <div class="legend">
        <span><i class="dot" style="background:#58a6ff"></i>当前路径</span>
        <span><i class="dot" style="background:#2f6b45"></i>已探索</span>
        <span><i class="dot" style="background:#3fb950"></i>答案</span>
        <span><i class="dot" style="background:#f85149"></i>剪枝</span>
        <span><i class="dot" style="background:#d29922"></i>回溯</span>
      </div>
    </div>
  </div>

  <div class="rightCol">
    <div class="panel" style="flex:1">
      <div class="panel-head"><span>当前状态</span><span id="stepInfo">步骤 0 / 0</span></div>
      <div class="state-body">
        <div class="tmp-display" id="tmpDisplay"><span class="empty">（空字符串）</span></div>
        <div class="counters">
          <div class="counter l"><div class="lbl">left 已用</div><div class="val" id="leftCnt">0</div></div>
          <div class="counter r"><div class="lbl">right 已用</div><div class="val" id="rightCnt">0</div></div>
        </div>
        <div class="depth-box">
          <div class="lbl">递归调用栈深度（dfs 嵌套层数）</div>
          <div class="depth-track" id="depthTrack"></div>
        </div>
        <div class="desc" id="desc">点击「播放」「下一步」，或直接拖动进度条 / 点击树节点开始。</div>
      </div>
    </div>

    <div class="panel" style="flex:1.2">
      <div class="panel-head"><span>Solution.java · 当前执行行高亮</span></div>
      <div id="codeBody"></div>
    </div>
  </div>

  <div id="answers">
    <span class="lbl">res =</span>
    <span id="ansList" style="color:var(--muted);font-family:var(--mono);font-size:12px">[]</span>
  </div>
</main>

<script>
/* ============================================================
   1) 预生成 DFS 步骤
   ============================================================ */
function buildSteps(n){
  const steps = [];
  const nodes = {};
  const edges = [];
  let nodeSeq = 0;
  const newNode = (left,right,tmp,parent,pruned)=>{
    const id = 'n'+(nodeSeq++);
    nodes[id] = {id,left,right,tmp,parent,pruned:!!pruned,children:[]};
    if(parent) nodes[parent].children.push(id);
    return id;
  };
  const rootId = newNode(0,0,'',null,false);

  function dfs(nodeId, left, right, tmp){
    if(left===n && right===n){
      steps.push({
        action:'answer', nodeId, left, right, tmp, line:11,
        desc:`left == n && right == n 成立 → 把 "${tmp}" 加入 res，然后 return。`,
        descType:'ok'
      });
      return;
    }
    steps.push({
      action:'enter', nodeId, left, right, tmp, line:8,
      desc:`进入 dfs(left=${left}, right=${right}, tmp="${tmp || ''}")。先检查能不能加左括号。`,
      descType:''
    });

    if(left < n){
      const cid = newNode(left+1, right, tmp+'(', nodeId, false);
      edges.push({from:nodeId, to:cid, type:'walk'});
      steps.push({
        action:'add_left', nodeId:cid, left:left+1, right, tmp:tmp+'(', line:15,
        desc:`left=${left} < n=${n}，允许放 '(' → tmp 变为 "${tmp+'('}"，递归进入下一层。`,
        descType:''
      });
      dfs(cid, left+1, right, tmp+'(');
      steps.push({
        action:'back_left', nodeId, left, right, tmp, line:17,
        backEdge:{from:nodeId,to:cid},
        desc:`左分支走完，执行 deleteCharAt 撤销 '('，回到 "${tmp || ''}"，继续试右括号。`,
        descType:'warn'
      });
    } else {
      const cid = newNode(left+1, right, tmp+'(', nodeId, true);
      edges.push({from:nodeId, to:cid, type:'prune'});
      steps.push({
        action:'prune_left', nodeId:cid, left:left+1, right, tmp:tmp+'(', line:14,
        desc:`left=${left} >= n=${n}，左括号已满，不能再放 '(' —— 这一支被剪枝（红色虚线节点不会真正执行）。`,
        descType:'bad'
      });
    }

    if(right < left){
      const cid = newNode(left, right+1, tmp+')', nodeId, false);
      edges.push({from:nodeId, to:cid, type:'walk'});
      steps.push({
        action:'add_right', nodeId:cid, left, right:right+1, tmp:tmp+')', line:20,
        desc:`right=${right} < left=${left}，允许放 ')' → tmp 变为 "${tmp+')'}"，递归进入下一层。`,
        descType:''
      });
      dfs(cid, left, right+1, tmp+')');
      steps.push({
        action:'back_right', nodeId, left, right, tmp, line:22,
        backEdge:{from:nodeId,to:cid},
        desc:`右分支走完，撤销 ')'，回到 "${tmp || ''}"，本层结束返回上一层。`,
        descType:'warn'
      });
    } else {
      const cid = newNode(left, right+1, tmp+')', nodeId, true);
      edges.push({from:nodeId, to:cid, type:'prune'});
      steps.push({
        action:'prune_right', nodeId:cid, left, right:right+1, tmp:tmp+')', line:19,
        desc:`right=${right} >= left=${left}，再放 ')' 会出现 ")( " 这种非法序列 —— 这一支被剪枝。`,
        descType:'bad'
      });
    }
  }
  dfs(rootId, 0, 0, '');
  const ansCount = steps.filter(s=>s.action==='answer').length;
  steps.push({
    action:'done', nodeId:rootId, left:0, right:0, tmp:'', line:5,
    desc:`所有分支走完，generateParenthesis 返回 res，共 ${ansCount} 个合法组合。`,
    descType:'ok'
  });

  // 计算每个节点的首次/最后出现步骤
  Object.values(nodes).forEach(nd=>{
    nd.first = steps.findIndex(s=>s.nodeId===nd.id);
    nd.last = nd.first;
    for(let i=steps.length-1;i>=0;i--){
      if(steps[i].nodeId===nd.id){ nd.last=i; break; }
    }
  });
  return {steps, nodes, edges, rootId};
}

/* ===== Java 代码 ===== */
const CODE = [
 [1 , 'class Solution {'],
 [2 , '    public List<String> generateParenthesis(int n) {'],
 [3 , '        List<String> res = new ArrayList<>();'],
 [4 , '        StringBuilder tmp = new StringBuilder();'],
 [5 , '        dfs(n, 0, 0, tmp, res);'],
 [6 , '        return res;'],
 [7 , '    }'],
 [8 , '    void dfs(int n, int left, int right,'],
 [9 , '             StringBuilder tmp, List<String> res) {'],
 [10, '        if (left == n && right == n) {'],
 [11, '            res.add(tmp.toString());'],
 [12, '            return;'],
 [13, '        }'],
 [14, '        if (left < n) {'],
 [15, "            tmp.append('(');"],
 [16, '            dfs(n, left + 1, right, tmp, res);'],
 [17, '            tmp.deleteCharAt(tmp.length() - 1);'],
 [18, '        }'],
 [19, '        if (right < left) {'],
 [20, "            tmp.append(')');"],
 [21, '            dfs(n, left, right + 1, tmp, res);'],
 [22, '            tmp.deleteCharAt(tmp.length() - 1);'],
 [23, '        }'],
 [24, '    }'],
 [25, '}'],
];
const codeBody = document.getElementById('codeBody');
function highlight(code){
  return code
    .replace(/\b(class|public|void|if|else|return|new)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(int|String|List|StringBuilder|ArrayList)\b/g,'<span class="ty">$1</span>')
    .replace(/\b(dfs|generateParenthesis|add|append|deleteCharAt|toString|length)\b/g,'<span class="fn">$1</span>')
    .replace(/\b(res|tmp|left|right|n)\b/g,'<span class="nm">$1</span>');
}
function renderCode(curLine){
  codeBody.innerHTML = CODE.map(([ln,txt])=>{
    const cls = ln===curLine ? 'code-line cur' : 'code-line';
    return `<div class="${cls}"><span class="ln">${ln}</span><span>${highlight(txt)||' '}</span></div>`;
  }).join('');
}

/* ===== 树布局 ===== */
const svg = document.getElementById('treeSvg');
const treeWrap = document.getElementById('treeWrap');
const H_GAP = 78, V_GAP = 62, NODE_W = 66, NODE_H = 34;

function layoutTree(data, currentStep){
  const {nodes, edges, rootId} = data;
  const pos = {};
  let xCounter = 0;
  function place(id){
    const node = nodes[id];
    if(node.children.length===0){
      pos[id] = {x: xCounter*H_GAP + 40, y: node.tmp.length*V_GAP + 28};
      xCounter++;
    } else {
      node.children.forEach(c=>place(c));
      const xs = node.children.map(c=>pos[c].x);
      pos[id] = {x:(Math.min(...xs)+Math.max(...xs))/2, y:node.tmp.length*V_GAP+28};
    }
  }
  place(rootId);
  const W = xCounter*H_GAP + 60;
  const maxDepth = Math.max(...Object.values(nodes).map(n=>n.tmp.length));
  const H = maxDepth*V_GAP + 60;
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const curNodeId = currentStep ? currentStep.nodeId : null;
  const pathEdges = new Set();
  const pathNodes = new Set();
  if(curNodeId){
    let cur = curNodeId;
    while(nodes[cur]){
      pathNodes.add(cur);
      if(nodes[cur].parent) pathEdges.add(nodes[cur].parent+'|'+cur);
      cur = nodes[cur].parent;
    }
  }
  // 当前回溯边
  const backEdgeKey = currentStep && currentStep.backEdge
    ? currentStep.backEdge.from+'|'+currentStep.backEdge.to : null;

  let html = '';
  edges.forEach(e=>{
    const a = pos[e.from], b = pos[e.to];
    let cls = 'edge';
    const key = e.from+'|'+e.to;
    if(e.type==='prune'){
      cls += ' prune';
      if(pathEdges.has(key)) cls += ' cur';
    } else if(key===backEdgeKey){
      cls += ' back';
    } else if(pathEdges.has(key)){
      cls += ' cur';
    } else {
      // 子节点已探索完 → done
      const child = nodes[e.to];
      if(child.last < stepIdx) cls += ' done';
    }
    const midY = (a.y+b.y)/2;
    html += `<path class="${cls}" d="M${a.x},${a.y+NODE_H/2} L${a.x},${midY} L${b.x},${midY} L${b.x},${b.y-NODE_H/2}"/>`;
  });

  Object.values(nodes).forEach(n=>{
    const p = pos[n.id];
    const isCur = n.id===curNodeId;
    const onPath = pathNodes.has(n.id);
    const isAns = n.left===n.right && n.left===currentN && !n.pruned;
    let fill='#1c2330', stroke='#3d444d', txtColor='#c9d1d9', opacity=1;
    if(n.pruned){
      fill='rgba(248,81,73,.08)';stroke='#f85149';txtColor='#f85149';opacity=.75;
      if(onPath){fill='rgba(248,81,73,.2)';opacity=1;}
    } else if(onPath){
      fill='rgba(88,166,255,.18)';stroke='#58a6ff';
    } else if(n.last < stepIdx){
      fill='rgba(47,107,69,.12)';stroke='#2f6b45';
    }
    if(isAns){fill='rgba(63,185,80,.18)';stroke='#3fb950';}
    if(isCur) stroke='#fff';
    const label = n.tmp || '∅';
    const dash = n.pruned ? 'stroke-dasharray:3 3' : '';
    const tip = n.pruned
      ? `剪枝节点（不会执行）· ${n.tmp} · L${n.left} R${n.right}`
      : `${n.tmp||'空'} · L${n.left} R${n.right} · 点击跳转`;
    html += `<g class="node" data-id="${n.id}" transform="translate(${p.x-NODE_W/2},${p.y-NODE_H/2})" opacity="${opacity}">
      <title>${tip}</title>
      <rect width="${NODE_W}" height="${NODE_H}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${isCur?2:1.5}" style="${dash}"/>
      <text x="${NODE_W/2}" y="15" text-anchor="middle" fill="${txtColor}" font-size="12">${label}</text>
      <text x="${NODE_W/2}" y="27" text-anchor="middle" fill="${n.pruned?'#f85149':'#8b949e'}" font-size="9">L${n.left} R${n.right}</text>
    </g>`;
  });
  svg.innerHTML = html;
  return curNodeId ? pos[curNodeId] : null;
}

/* ===== 状态机 ===== */
let currentN = 3;
let data = buildSteps(currentN);
let stepIdx = -1, timer = null;

const tmpDisplay = document.getElementById('tmpDisplay');
const descEl = document.getElementById('desc');
const statsEl = document.getElementById('stats');
const slider = document.getElementById('slider');
const plLabel = document.getElementById('plLabel');

function renderStats(){
  const realNodes = Object.values(data.nodes).filter(n=>!n.pruned).length;
  const pruneNodes = Object.values(data.nodes).filter(n=>n.pruned).length;
  const ans = data.steps.filter(s=>s.action==='answer').length;
  statsEl.innerHTML =
    `<span>访问节点 <b>${realNodes}</b></span>`+
    `<span>剪枝 <b style="color:var(--red)">${pruneNodes}</b></span>`+
    `<span>答案 <b style="color:var(--green)">${ans}</b></span>`;
}

let prevTmp = '';
function render(){
  const s = stepIdx>=0 ? data.steps[stepIdx] : null;
  const left = s ? s.left : 0;
  const right = s ? s.right : 0;
  const tmp = s ? s.tmp : '';
  document.getElementById('leftCnt').textContent = left;
  document.getElementById('rightCnt').textContent = right;
  if(tmp){
    const isNewLonger = tmp.length > prevTmp.length;
    tmpDisplay.innerHTML = tmp.split('').map((c,i)=>{
      const color = c==='(' ? 'var(--blue)' : 'var(--orange)';
      const cls = (isNewLonger && i===tmp.length-1) ? 'new' : '';
      return `<span class="${cls}" style="color:${color}">${c}</span>`;
    }).join('');
  } else {
    tmpDisplay.innerHTML = '<span class="empty">（空字符串）</span>';
  }
  prevTmp = tmp;

  const depth = tmp.length, maxDepth = currentN*2;
  document.getElementById('depthTrack').innerHTML =
    Array.from({length:maxDepth},(_,i)=>`<div class="depth-cell${i<depth?' on':''}"></div>`).join('');

  if(s){
    descEl.textContent = s.desc;
    descEl.className = 'desc '+(s.descType||'');
    renderCode(s.line);
  } else {
    descEl.textContent = '点击「播放」「下一步」，或直接拖动进度条 / 点击树节点开始。';
    descEl.className='desc'; renderCode(0);
  }
  document.getElementById('stepInfo').textContent =
    `步骤 ${Math.max(stepIdx+1,0)} / ${data.steps.length}`;

  const ans = [];
  for(let i=0;i<=stepIdx;i++){
    if(data.steps[i].action==='answer') ans.push(data.steps[i].tmp);
  }
  const ansList = document.getElementById('ansList');
  const ansChipBox = document.getElementById('answers');
  if(ans.length===0){
    ansList.textContent='[]';
    ansChipBox.querySelectorAll('.ans-chip').forEach(e=>e.remove());
  } else {
    ansList.textContent='';
    ansChipBox.querySelectorAll('.ans-chip').forEach(e=>e.remove());
    ans.forEach(a=>{
      const chip=document.createElement('span');
      chip.className='ans-chip';chip.textContent=a;
      ansChipBox.appendChild(chip);
    });
  }

  const curPos = layoutTree(data, s);
  renderStats();

  // 同步滑块
  slider.max = data.steps.length-1;
  slider.value = Math.max(stepIdx,0);
  plLabel.textContent = `步骤 ${Math.max(stepIdx+1,0)} / ${data.steps.length}`;

  if(curPos){
    const wrapRect = treeWrap.getBoundingClientRect();
    treeWrap.scrollTo({
      left:Math.max(0,curPos.x-wrapRect.width/2),
      top:Math.max(0,curPos.y-wrapRect.height/2),
      behavior:'smooth'
    });
  }
}

function next(){
  if(stepIdx>=data.steps.length-1){pause();return;}
  stepIdx++; render();
}
function prev(){ if(stepIdx>-1){stepIdx--;render();} }
function reset(){ pause(); stepIdx=-1; prevTmp=''; render(); }
function pause(){
  if(timer){clearInterval(timer);timer=null;}
  document.getElementById('btnPlay').textContent='▶ 播放';
}
function play(){
  if(timer){pause();return;}
  if(stepIdx>=data.steps.length-1) stepIdx=-1;
  document.getElementById('btnPlay').textContent='⏸ 暂停';
  timer=setInterval(()=>{
    if(stepIdx>=data.steps.length-1){pause();return;}
    next();
  },+document.getElementById('speed').value);
}

document.getElementById('btnNext').onclick=()=>{pause();next();};
document.getElementById('btnPrev').onclick=()=>{pause();prev();};
document.getElementById('btnPlay').onclick=play;
document.getElementById('btnReset').onclick=reset;
document.getElementById('speed').onchange=()=>{if(timer){pause();play();}};

slider.addEventListener('input',()=>{
  pause();
  stepIdx = +slider.value;
  if(stepIdx===0) stepIdx=-1;
  render();
});

// 节点点击跳转
svg.addEventListener('click', e=>{
  const g = e.target.closest('g.node');
  if(!g) return;
  const id = g.getAttribute('data-id');
  const target = data.nodes[id];
  if(target && target.first>=0){
    pause();
    stepIdx = target.first;
    render();
  }
});

document.querySelectorAll('#nSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#nSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    currentN=+b.dataset.n;
    data=buildSteps(currentN);
    prevTmp='';
    reset();
  };
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){pause();next();}
  if(e.key==='ArrowLeft'){pause();prev();}
  if(e.key===' '){e.preventDefault();play();}
});
render();
</script>
</body>
</html>
