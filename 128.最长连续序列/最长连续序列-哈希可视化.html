<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>128. 最长连续序列 · HashSet 可视化</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>1</text></svg>">
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;
    --purple:#bc8cff;--orange:#e3b341;--red:#f85149;--mono:"Cascadia Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.5;padding:22px;max-width:1180px;margin:0 auto}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:21px;font-weight:700}
  .diff{font-size:12px;color:var(--orange);border:1px solid var(--orange);border-radius:6px;padding:2px 8px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .casebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .casebtn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .casebtn.active{border-color:var(--blue);background:rgba(88,166,255,.12);color:var(--blue)}
  .ideacard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:12.5px;color:var(--muted)}
  .ideacard b{color:var(--blue)}
  .vizwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
  .vizwrap h2{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600}
  .setpanel{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  .setgrid{display:flex;gap:8px;flex-wrap:wrap}
  .nbox{min-width:52px;height:48px;border-radius:8px;background:var(--panel);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;padding:0 8px;position:relative}
  .nbox.cur{border-color:var(--orange);color:var(--orange)}
  .nbox.probe{border-color:var(--red);color:var(--red);box-shadow:0 0 0 2px rgba(248,81,73,.4)}
  .nbox.seq{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)}
  .nbox.skip{opacity:.45}
  .nbox .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;background:var(--panel2);padding:0 4px;border-radius:3px;white-space:nowrap}
  .seqline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;min-height:34px}
  .seqtag{background:rgba(63,185,80,.13);border:1px solid var(--green);color:var(--green);border-radius:7px;padding:5px 11px;font-weight:700}
  .seqlabel{font-size:11px;color:var(--muted)}
  .msg{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:14px;min-height:44px}
  .infobar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .icard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .icard .lab{font-size:11px;color:var(--muted);margin-bottom:4px}
  .icard .vval{font-size:17px;font-weight:700;word-break:break-all}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button.ctl{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  button.ctl:hover{border-color:var(--blue)}
  button.ctl.primary{background:var(--blue);color:#0d1117;border-color:var(--blue);font-weight:700}
  .slider{flex:1;min-width:140px;accent-color:var(--blue)}
  .stepmeta{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
  .speed{display:flex;gap:4px;margin-left:auto}
  .spd{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:11px}
  .spd.active{border-color:var(--green);color:var(--green)}
  .codewrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto}
  .codewrap h2{font-size:13px;color:var(--muted);margin-bottom:12px}
  .ln{display:block;padding:2px 10px;font-size:13px;white-space:pre;border-left:3px solid transparent}
  .ln.on{background:rgba(88,166,255,.13);border-left-color:var(--blue)}
  .kw{color:#ff7b72}.str{color:#a5d6ff}.cmt{color:#8b949e;font-style:italic}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}.nbox{min-width:44px;height:42px}}
</style>
</head>
<body>
  <div class="top">
    <h1>128. 最长连续序列</h1>
    <span class="diff">中等</span>
  </div>
  <div class="sub">HashSet 找起点 · 时间 O(n) 空间 O(n) · 元素在原数组中是否相邻无所谓，只看数值连续</div>

  <div class="casebar" id="casebar"></div>

  <div class="ideacard">
    核心：所有数放进 <b>HashSet</b>（去重、O(1) 查询）。只从<b>起点</b>开始数——若 <b>num-1 不在集合</b>，num 才是起点；再 while 不断查 num+1 数出长度。每个数最多被数一次，所以 O(n)。
  </div>

  <div class="vizwrap">
    <h2>HashSet 中的数字（按数值排列，方便看连续）</h2>
    <div class="setpanel">
      <div class="setgrid" id="setgrid"></div>
    </div>
    <h2>当前正在数的序列</h2>
    <div class="seqline" id="seqline"></div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="infobar">
    <div class="icard"><div class="lab">当前数字</div><div class="vval" id="curNum" style="color:var(--orange)">—</div></div>
    <div class="icard"><div class="lab">当前序列长度</div><div class="vval" id="curLen" style="color:var(--green)">0</div></div>
    <div class="icard"><div class="lab">最大长度</div><div class="vval" id="maxLen" style="color:var(--purple)">0</div></div>
  </div>

  <div class="controls">
    <button class="ctl primary" id="play"><span id="playtxt">播放</span></button>
    <button class="ctl" id="prev">上一步</button>
    <button class="ctl" id="next">下一步</button>
    <button class="ctl" id="reset">重置</button>
    <input type="range" class="slider" id="slider" min="0" max="0" value="0">
    <span class="stepmeta" id="stepmeta">0 / 0</span>
    <div class="speed">
      <button class="spd" data-ms="1200">0.5x</button>
      <button class="spd active" data-ms="800">1x</button>
      <button class="spd" data-ms="400">2x</button>
    </div>
  </div>

  <div class="codewrap">
    <h2>Java HashSet 解法</h2>
    <div id="code"></div>
  </div>

<script>
const CASES=[
  [100,4,200,1,3,2],
  [0,3,7,2,5,8,4,6,0,1],
  [1,0,1,2]
];
const CODE=[
  '<span class="kw">class</span> Solution {',
  '  <span class="kw">public int</span> longestConsecutive(<span class="kw">int</span>[] nums) {',
  '      HashSet&lt;Integer&gt; numSet = <span class="kw">new</span> HashSet&lt;&gt;();',
  '      <span class="kw">for</span> (<span class="kw">int</span> num : nums){',
  '          numSet.add(num);',
  '      }',
  '      <span class="kw">int</span> maxLength = 0;',
  '      <span class="kw">for</span> (<span class="kw">int</span> num : numSet){',
  '          <span class="kw">if</span> (!numSet.contains(num-1)){',
  '              <span class="kw">int</span> currentnum = num;',
  '              <span class="kw">int</span> currentLength = 1;',
  '              <span class="kw">while</span> (numSet.contains(currentnum+1)){',
  '                  currentnum++;',
  '                  currentLength++;',
  '              }',
  '              maxLength = Math.max(maxLength,currentLength);',
  '          }',
  '      }',
  '      <span class="kw">return</span> maxLength;',
  '  }',
  '}'
];
$('code').innerHTML=CODE.map(l=>`<span class="ln">${l}</span>`).join('');

function buildSteps(nums){
  const uniq=[...new Set(nums)].sort((a,b)=>a-b);
  const built=new Set(uniq);
  const out=[];
  let maxLen=0;const skipSet=[];
  const base=()=>({setArr:uniq,cur:null,probe:null,seq:[],seqSet:[],skipSet:[],curLen:0,maxLen:0});
  const mk=extra=>{const b=base();b.maxLen=maxLen;b.skipSet=skipSet.slice();return Object.assign(b,extra);};
  out.push(mk({msg:'初始化空 HashSet numSet，开始把数组元素逐个 add。',line:2}));
  const seen=new Set();
  for(const n of nums){
    if(seen.has(n)){
      out.push(mk({probe:n,msg:`add(${n})：集合里已经有了，Set 自动去重，不会重复放入。`,line:4}));
    }else{
      seen.add(n);
      out.push(mk({probe:n,msg:`add(${n}) 放入集合，当前共 ${seen.size} 个元素。`,line:4}));
    }
  }
  out.push(mk({msg:`建集合完成，共 ${uniq.length} 个唯一值。maxLength=0，开始遍历找起点。`,line:6}));
  for(const num of uniq){
    out.push(mk({cur:num,msg:`检查 num=${num}，先看它是不是起点：contains(${num-1})？`,line:7}));
    if(built.has(num-1)){
      skipSet.push(num);
      out.push(mk({cur:num,probe:num-1,msg:`contains(${num-1})=true，前面有更小的连续数，${num} 不是起点，跳过。`,line:8}));
    }else{
      out.push(mk({cur:num,probe:num-1,msg:`contains(${num-1})=false，${num} 是序列起点，currentLength=1，从它开始往后数。`,line:8}));
      let cnum=num,curLen=1;const seq=[num];
      out.push(mk({cur:num,seq,seqSet:seq.slice(),curLen,msg:`起点 currentnum=${cnum}，currentLength=1。`,line:10}));
      while(built.has(cnum+1)){
        out.push(mk({cur:num,probe:cnum+1,seq:seq.slice(),seqSet:seq.slice(),curLen,msg:`contains(${cnum+1})=true，下一个数存在，准备纳入。`,line:11}));
        cnum++;curLen++;seq.push(cnum);
        out.push(mk({cur:num,seq:seq.slice(),seqSet:seq.slice(),curLen,msg:`currentnum=${cnum}，currentLength=${curLen}，序列 [${seq.join(',')}]。`,line:13}));
      }
      out.push(mk({cur:num,probe:cnum+1,seq:seq.slice(),seqSet:seq.slice(),curLen,msg:`contains(${cnum+1})=false，这条序列结束，长度 ${curLen}。`,line:11}));
      if(curLen>maxLen)maxLen=curLen;
      out.push(mk({cur:num,seq:seq.slice(),seqSet:seq.slice(),curLen,maxLen,msg:`Math.max 后最大长度更新为 ${maxLen}。`,line:15}));
    }
  }
  out.push(mk({maxLen,msg:`遍历结束，return maxLength = ${maxLen}。`,line:18}));
  return out;
}
let steps=[],posIdx=0,curCase=0,timer=null,playMs=800;
function $(id){return document.getElementById(id);}
function render(){
  const s=steps[posIdx];
  $('msg').innerHTML=s.msg;
  $('stepmeta').textContent=`${posIdx} / ${steps.length-1}`;
  $('slider').value=posIdx;
  $('curNum').textContent=s.cur===null?'—':s.cur;
  $('curLen').textContent=s.curLen;
  $('maxLen').textContent=s.maxLen;
  $('setgrid').innerHTML=s.setArr.map(n=>{
    let cls='nbox';let tag='';
    if(s.seqSet.includes(n)){cls+=' seq';}
    if(s.skipSet.includes(n)){cls+=' skip';}
    if(n===s.probe){cls+=' probe';tag='<span class="tag">查</span>';}
    if(n===s.cur){cls+=' cur';if(!tag)tag='<span class="tag">num</span>';}
    return `<div class="${cls}">${tag}${n}</div>`;
  }).join('');
  if(s.seq.length){
    $('seqline').innerHTML='<span class="seqlabel">序列：</span>'+s.seq.map(n=>`<span class="seqtag">${n}</span>`).join('')
      +`<span class="seqlabel" style="margin-left:8px">长度 ${s.curLen}</span>`;
  }else{
    $('seqline').innerHTML='<span class="seqlabel">还没有开始数序列</span>';
  }
  document.querySelectorAll('.ln').forEach((el,i)=>el.classList.toggle('on',i===s.line));
}
function stopPlay(){if(timer){clearInterval(timer);timer=null;$('playtxt').textContent='播放';}}
function loadCase(i){
  curCase=i;
  steps=buildSteps(CASES[i]);posIdx=0;
  $('slider').max=steps.length-1;
  document.querySelectorAll('.casebtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  stopPlay();render();
}
$('casebar').innerHTML=CASES.map((c,i)=>`<button class="casebtn${i===0?' active':''}">用例 ${i+1}</button>`).join('');
document.querySelectorAll('.casebtn').forEach((b,i)=>b.onclick=()=>loadCase(i));
$('play').onclick=()=>{
  if(timer){stopPlay();return;}
  $('playtxt').textContent='暂停';
  timer=setInterval(()=>{if(posIdx>=steps.length-1){stopPlay();}else{posIdx++;render();}},playMs);
};
$('next').onclick=()=>{stopPlay();if(posIdx<steps.length-1){posIdx++;render();}};
$('prev').onclick=()=>{stopPlay();if(posIdx>0){posIdx--;render();}};
$('reset').onclick=()=>{stopPlay();posIdx=0;render();};
$('slider').oninput=e=>{stopPlay();posIdx=+e.target.value;render();};
document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{
  playMs=+b.dataset.ms;
  document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('active',x===b));
  if(timer){stopPlay();$('play').onclick();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')$('next').onclick();
  if(e.key==='ArrowLeft')$('prev').onclick();
});
loadCase(0);
</script>
</body>
</html>
