<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15. 三数之和 · 排序双指针可视化</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>3</text></svg>">
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;
    --purple:#bc8cff;--orange:#e3b341;--red:#f85149;
    --mono:"Cascadia Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.5;padding:22px;max-width:1180px;margin:0 auto}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:21px;font-weight:700}
  .diff{font-size:12px;color:var(--orange);border:1px solid var(--orange);border-radius:6px;padding:2px 8px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .casebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .casebtn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .casebtn.active{border-color:var(--blue);background:rgba(88,166,255,.12);color:var(--blue)}
  .ideacard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:12.5px;color:var(--muted)}
  .ideacard b{color:var(--blue)}
  .vizwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
  .vizwrap h2{font-size:13px;color:var(--muted);margin-bottom:18px;font-weight:600}
  .arrayrow{display:flex;gap:9px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .abox{width:52px;height:52px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
  .abox.a{border-color:var(--purple);color:var(--purple)}
  .abox.left{border-color:var(--orange);color:var(--orange)}
  .abox.right{border-color:var(--blue);color:var(--blue)}
  .abox.found{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.12);animation:popIn .3s ease}
  .abox.dup{opacity:.4}
  .ptr{font-size:10px;height:16px;border-radius:4px;padding:0 5px;display:flex;align-items:center;font-weight:700}
  .ptr.pa{color:var(--purple);border:1px solid var(--purple)}
  .ptr.pl{color:var(--orange);border:1px solid var(--orange)}
  .ptr.pr{color:var(--blue);border:1px solid var(--blue)}
  .idx{font-size:11px;color:var(--muted)}
  .sumline{margin-top:16px;font-size:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .sumchip{border-radius:7px;padding:6px 12px;font-weight:700;border:1px solid var(--border)}
  .reswrap{margin-top:18px;border-top:1px solid var(--border);padding-top:16px}
  .reswrap h2{margin-bottom:11px}
  .reslist{display:flex;gap:9px;flex-wrap:wrap}
  .trip{background:var(--panel2);border:1px solid var(--green);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--green);animation:popIn .3s ease}
  .msg{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:14px;min-height:44px}
  .infobar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .icard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .icard .lab{font-size:11px;color:var(--muted);margin-bottom:4px}
  .icard .vval{font-size:17px;font-weight:700}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button.ctl{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  button.ctl:hover{border-color:var(--blue)}
  button.ctl.primary{background:var(--blue);color:#0d1117;border-color:var(--blue);font-weight:700}
  .slider{flex:1;min-width:140px;accent-color:var(--blue)}
  .stepmeta{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
  .speed{display:flex;gap:4px;margin-left:auto}
  .spd{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:11px}
  .spd.active{border-color:var(--green);color:var(--green)}
  .codewrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto}
  .codewrap h2{font-size:13px;color:var(--muted);margin-bottom:12px}
  .ln{display:block;padding:2px 10px;font-size:13px;white-space:pre;border-left:3px solid transparent}
  .ln.on{background:rgba(88,166,255,.13);border-left-color:var(--blue)}
  .kw{color:#ff7b72}
  @keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @media(max-width:760px){.infobar{grid-template-columns:1fr}.abox{width:44px;height:46px}}
</style>
</head>
<body>
  <div class="top">
    <h1>15. 三数之和</h1>
    <span class="diff">中等</span>
  </div>
  <div class="sub">排序 + 固定 a + 双指针夹逼 · 时间 O(n²) 空间 O(log n) 排序栈 · 答案不含重复三元组</div>

  <div class="casebar" id="casebar"></div>

  <div class="ideacard">
    先排序。外层固定 <b>a</b>，<b>left=a+1、right=末尾</b> 向内夹：三数和为 0 就记录并去重，和小 left++、和大 right--。三处去重：a 与上一个相同则 continue；找到答案后跳过相同的 left 和 right。
  </div>

  <div class="vizwrap">
    <h2>排序后的数组（指针：紫=a，橙=left，蓝=right）</h2>
    <div class="arrayrow" id="arrayrow"></div>
    <div class="sumline" id="sumline"></div>
    <div class="reswrap">
      <h2>已找到的三元组</h2>
      <div class="reslist" id="reslist"></div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="infobar">
    <div class="icard"><div class="lab">固定 a</div><div class="vval" id="vA" style="color:var(--purple)">—</div></div>
    <div class="icard"><div class="lab">当前三数和</div><div class="vval" id="vSum" style="color:var(--orange)">0</div></div>
    <div class="icard"><div class="lab">答案组数</div><div class="vval" id="vCount" style="color:var(--green)">0</div></div>
  </div>

  <div class="controls">
    <button class="ctl primary" id="play"><span id="playtxt">播放</span></button>
    <button class="ctl" id="prev">上一步</button>
    <button class="ctl" id="next">下一步</button>
    <button class="ctl" id="reset">重置</button>
    <input type="range" class="slider" id="slider" min="0" max="0" value="0">
    <span class="stepmeta" id="stepmeta">0 / 0</span>
    <div class="speed">
      <button class="spd" data-ms="1200">0.5x</button>
      <button class="spd active" data-ms="800">1x</button>
      <button class="spd" data-ms="400">2x</button>
    </div>
  </div>

  <div class="codewrap">
    <h2>Java 排序双指针代码</h2>
    <div id="code"></div>
  </div>

<script>
const CASES=[
  [-1,0,1,2,-1,-4],
  [0,0,0,0],
  [-2,0,0,2,2]
];
const CODE=[
  '<span class="kw">class</span> Solution {',
  '  <span class="kw">public</span> List&lt;List&lt;Integer&gt;&gt; threeSum(<span class="kw">int</span>[] nums) {',
  '      List&lt;List&lt;Integer&gt;&gt; res = <span class="kw">new</span> ArrayList&lt;&gt;();',
  '      Arrays.sort(nums);',
  '      <span class="kw">for</span> (<span class="kw">int</span> a = 0; a &lt; nums.length; a++) {',
  '          <span class="kw">if</span> (a &gt; 0 && nums[a] == nums[a-1]) {',
  '              <span class="kw">continue</span>;',
  '          }',
  '          <span class="kw">int</span> left = a+1, right = nums.length-1;',
  '          <span class="kw">while</span> (left &lt; right) {',
  '              <span class="kw">int</span> sum = nums[a]+nums[left]+nums[right];',
  '              <span class="kw">if</span> (sum == 0) {',
  '                  res.add(Arrays.asList(nums[a],nums[left],nums[right]));',
  '                  left++;',
  '                  <span class="kw">while</span> (left &lt; right && nums[left] == nums[left-1]) left++;',
  '                  right--;',
  '                  <span class="kw">while</span> (left &lt; right && nums[right] == nums[right+1]) right--;',
  '              } <span class="kw">else if</span> (sum &lt; 0) {',
  '                  left++;',
  '              } <span class="kw">else</span> {',
  '                  right--;',
  '              }',
  '          }',
  '      }',
  '      <span class="kw">return</span> res;',
  '  }',
  '}'
];
$('code').innerHTML=CODE.map(l=>`<span class="ln">${l}</span>`).join('');

function buildSteps(nums){
  const arr=nums.slice().sort((x,y)=>x-y);
  const n=arr.length;
  const out=[];const trips=[];
  let a=null,left=null,right=null,sum=null,found=null,dupSet=[];
  const snap=()=>({arr,a,left,right,sum,found,trips:trips.map(t=>t.slice()),dupSet:dupSet.slice(),line:null});
  const push=(msg,line,extra)=>{const s=snap();s.msg=msg;s.line=line;if(extra)Object.assign(s,extra);out.push(s);};
  push('初始化空 res，Arrays.sort 先把数组排序，这是双指针的前提。',3);
  for(let ai=0;ai<n;ai++){
    a=ai;found=null;
    if(ai>0&&arr[ai]===arr[ai-1]){
      dupSet=dupSet.concat(ai);
      push(`a=${ai}，nums[a]=${arr[ai]} 和上一个相同，continue 跳过，避免重复的固定值。`,6,{dupSet:dupSet.slice()});
      continue;
    }
    left=ai+1;right=n-1;
    push(`固定 a=${ai}（值 ${arr[ai]}），left=${left}，right=${right}，开始夹逼。`,8);
    while(left<right){
      sum=arr[a]+arr[left]+arr[right];
      if(sum===0){
        const trip=[arr[a],arr[left],arr[right]];
        found=trip;trips.push(trip);
        push(`sum=${arr[a]}+${arr[left]}+${arr[right]}=0，找到三元组 [${trip.join(',')}]，add 进 res。`,12,{found:trip});
        left++;
        while(left<right&&arr[left]===arr[left-1]){
          push(`left 位置 ${left} 的值和上一个相同，跳过，防止重复三元组。`,14);left++;
        }
        right--;
        while(left<right&&arr[right]===arr[right+1]){
          push(`right 位置 ${right} 的值和上一个相同，跳过。`,16);right--;
        }
        if(left>=right){
          push(`去重后 left=${left}、right=${right}，条件 left<right 不成立，while 立即停止，指针不再前进，避免访问到数组外。`,14,{sum:null});
        }
      }else if(sum<0){
        push(`sum=${sum}<0，和太小，left++（这步不产生答案，无需去重）。`,18);left++;
      }else{
        push(`sum=${sum}>0，和太大，right--（不产生答案，无需去重）。`,20);right--;
      }
    }
  }
  a=null;left=null;right=null;sum=null;found=null;
  push(`遍历结束，共 ${trips.length} 组，return res。`,24);
  return out;
}
let steps=[],posIdx=0,curCase=0,timer=null,playMs=800;
function $(id){return document.getElementById(id);}
function render(){
  const s=steps[posIdx];
  $('msg').innerHTML=s.msg;
  $('stepmeta').textContent=`${posIdx} / ${steps.length-1}`;
  $('slider').value=posIdx;
  $('vA').textContent=s.a===null?'—':`${s.a} (${s.arr[s.a]})`;
  $('vSum').textContent=s.sum===null?'—':s.sum;
  $('vCount').textContent=s.trips.length;
  $('arrayrow').innerHTML=s.arr.map((v,i)=>{
    let cls='abox';
    if(s.dupSet.includes(i))cls+=' dup';
    if(s.found&&s.found.includes(v)&&(i===s.a||i===s.left||i===s.right))cls+=' found';
    if(i===s.right)cls+=' right';
    if(i===s.left)cls+=' left';
    if(i===s.a)cls+=' a';
    let ptrs='';
    if(i===s.a)ptrs+='<span class="ptr pa">a</span>';
    if(i===s.left)ptrs+='<span class="ptr pl">left</span>';
    if(i===s.right)ptrs+='<span class="ptr pr">right</span>';
    return `<div class="cell"><div class="${cls}">${v}</div><div>${ptrs}</div><div class="idx">${i}</div></div>`;
  }).join('');
  if(s.sum!==null){
    let col=var2col(s.sum);
    $('sumline').innerHTML=`<span class="sumlabel" style="font-size:12px;color:var(--muted)">三数和：</span>
      <span class="sumchip" style="color:${col};border-color:${col}">${s.sum}</span>
      <span style="font-size:11px;color:var(--muted)">${s.sum===0?'=0 记录':s.sum<0?'<0 移 left':'>0 移 right'}</span>`;
  }else{$('sumline').innerHTML='';}
  $('reslist').innerHTML=s.trips.length?s.trips.map(t=>`<span class="trip">[${t.join(',')}]</span>`).join('')
    :'<span style="font-size:12px;color:var(--muted)">还没找到三元组</span>';
  document.querySelectorAll('.ln').forEach((el,i)=>el.classList.toggle('on',i===s.line));
}
function var2col(sum){if(sum===0)return 'var(--green)';if(sum<0)return 'var(--orange)';return 'var(--blue)';}
function stopPlay(){if(timer){clearInterval(timer);timer=null;$('playtxt').textContent='播放';}}
function loadCase(i){
  curCase=i;
  steps=buildSteps(CASES[i]);posIdx=0;
  $('slider').max=steps.length-1;
  document.querySelectorAll('.casebtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  stopPlay();render();
}
$('casebar').innerHTML=CASES.map((c,i)=>`<button class="casebtn${i===0?' active':''}">用例 ${i+1}</button>`).join('');
document.querySelectorAll('.casebtn').forEach((b,i)=>b.onclick=()=>loadCase(i));
$('play').onclick=()=>{
  if(timer){stopPlay();return;}
  $('playtxt').textContent='暂停';
  timer=setInterval(()=>{if(posIdx>=steps.length-1){stopPlay();}else{posIdx++;render();}},playMs);
};
$('next').onclick=()=>{stopPlay();if(posIdx<steps.length-1){posIdx++;render();}};
$('prev').onclick=()=>{stopPlay();if(posIdx>0){posIdx--;render();}};
$('reset').onclick=()=>{stopPlay();posIdx=0;render();};
$('slider').oninput=e=>{stopPlay();posIdx=+e.target.value;render();};
document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{
  playMs=+b.dataset.ms;
  document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('active',x===b));
  if(timer){stopPlay();$('play').onclick();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')$('next').onclick();
  if(e.key==='ArrowLeft')$('prev').onclick();
});
loadCase(0);
</script>
</body>
</html>
