<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>112. 路径总和 · DFS 递归可视化</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%2358a6ff'/></svg>">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --blue:#58a6ff; --green:#3fb950;
  --orange:#e3b341; --purple:#bc8cff; --red:#f85149;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;}
.wrap{max-width:1280px;margin:0 auto;padding:28px 26px 40px;}
h1{font-size:27px;margin:0 0 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.badge{font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;background:rgba(63,185,80,.15);color:var(--green);}
.subtitle{color:var(--muted);margin:0 0 22px;font-size:14.5px;}
.info-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:20px;}
.info-panel p{margin:0 0 14px;color:var(--muted);font-size:14px;}
.info-panel b{color:var(--text);font-weight:600;}
.info-panel .hl-b{color:var(--blue);font-weight:600;}
.info-panel .hl-o{color:var(--orange);font-weight:600;}
#cases{display:flex;flex-wrap:wrap;gap:8px;}
.case-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:7px 13px;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s;}
.case-btn:hover{border-color:var(--blue);}
.case-btn.active{background:rgba(88,166,255,.14);border-color:var(--blue);color:var(--blue);}
.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-head{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--muted);
  font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
#stage{position:relative;height:380px;}
.legend{position:absolute;left:16px;bottom:6px;display:flex;gap:13px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;}
.dot.a{background:var(--blue);} .dot.o{background:var(--orange);} .dot.r{background:var(--red);}

.tnode{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:600;background:var(--panel2);border:2px solid var(--border);color:var(--muted);
  transition:border-color .16s,background .16s,color .16s;z-index:3;}
.tnode.active{border-color:var(--blue);background:rgba(88,166,255,.17);color:var(--blue);}
.tnode.onpath{border-color:var(--blue);background:rgba(88,166,255,.1);color:var(--blue);}
.tnode.found{border-color:var(--orange);background:rgba(227,179,65,.2);color:var(--orange);
  box-shadow:0 0 0 3px rgba(227,179,65,.14);}
.tnode.dead{border-color:var(--red);background:rgba(248,81,73,.15);color:var(--red);}
.rem-label{position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:11.5px;
  font-family:Consolas,monospace;color:var(--blue);white-space:nowrap;opacity:0;transition:opacity .15s;}
.rem-label.show{opacity:1;}
.edge{position:absolute;height:2px;background:var(--border);transform-origin:0 50%;border-radius:1px;z-index:1;}
.edge.onpath{background:var(--blue);}
.edge.found{background:var(--orange);height:2.5px;box-shadow:0 0 6px rgba(227,179,65,.55);}
.edge.dead{background:var(--red);height:2px;}
.pill{position:absolute;font-size:13px;color:var(--muted);font-family:Consolas,monospace;}
.pill b{font-weight:700;font-size:14px;}
.pill b.orange{color:var(--orange);} .pill b.red{color:var(--red);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;border-top:1px solid var(--border);}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;min-width:0;}
.stat .k{font-size:12px;color:var(--muted);margin-bottom:3px;}
.stat .val{font-size:13.5px;font-weight:600;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.val.blue{color:var(--blue);} .val.orange{color:var(--orange);} .val.red{color:var(--red);} .val.green{color:var(--green);}

.controls{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--border);flex-wrap:wrap;}
.ctrl-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;
  width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ctrl-btn:hover:not(:disabled){border-color:var(--blue);}
.ctrl-btn:disabled{opacity:.4;cursor:not-allowed;}
.ctrl-btn.wide{width:auto;padding:0 16px;gap:7px;font-size:14px;}
.ctrl-btn svg{width:18px;height:18px;fill:var(--text);}
#slider{flex:1;min-width:120px;height:5px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px;outline:none;}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;}
#pcount{font-size:13px;color:var(--muted);font-family:Consolas,monospace;min-width:56px;text-align:center;}
#speed{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 8px;font-size:13.5px;cursor:pointer;}
.kbd-hint{padding:0 16px 13px;font-size:12.5px;color:var(--muted);}

#codeCard{display:flex;flex-direction:column;}
.code-wrap{flex:1;overflow:auto;padding:14px 0;}
.code-inner{display:flex;min-width:max-content;}
.line-nums{padding:0 12px 0 16px;text-align:right;color:var(--muted);font-size:13.5px;line-height:1.7;
  font-family:Consolas,monospace;user-select:none;border-right:1px solid var(--border);}
.code-lines{padding:0 16px 0 12px;font-family:Consolas,monospace;font-size:13.5px;line-height:1.7;min-width:0;}
.code-line{white-space:pre;border-radius:4px;padding:0 6px;margin:0 -6px;}
.code-line.hl{background:rgba(88,166,255,.13);box-shadow:inset 3px 0 0 var(--blue);}
.t-kw{color:#ff7b72;} .t-type{color:#79c0ff;} .t-fn{color:#d2a8ff;}
.t-id{color:#e6edf3;} .t-bool{color:#79c0ff;} .t-num{color:#e3b341;}
#msg{padding:11px 16px;border-top:1px solid var(--border);font-size:13.5px;color:var(--text);background:var(--panel2);min-height:44px;}
@media (max-width:980px){.main-grid{grid-template-columns:1fr;}#codeCard{max-height:520px;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>112. 路径总和 <span class="badge">简单</span></h1>
  <p class="subtitle">DFS 向下走，剩余目标逐个减去节点值，叶子节点判断是否恰好相等</p>

  <div class="info-panel">
    <p>判断是否存在<span class="hl-b">根到叶子</span>的路径，使节点值之和等于目标。递归时把目标<span class="hl-b">减去当前节点值</span>继续向下传；根为空直接 false。走到<span class="hl-o">叶子节点</span>时，若剩余目标恰好等于叶子值则命中（true），否则此路不通。左右用短路或连接，找到一条即返回。</p>
    <div id="cases"></div>
  </div>

  <div class="main-grid">
    <div class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="var(--muted)"><path d="M12 3v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
        DFS 递归与叶子判断
      </div>
      <div id="stage">
        <div class="pill" style="left:18px;top:14px;" id="tgtPill">目标 target = <b>22</b></div>
        <div class="pill" style="right:18px;top:14px;" id="resPill">结果 = <b class="orange">—</b></div>
        <div class="legend">
          <span><span class="dot a"></span>当前递归路径</span>
          <span><span class="dot o"></span>命中路径</span>
          <span><span class="dot r"></span>叶子不匹配</span>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="k">当前节点</div><div class="val blue" id="i-node">&mdash;</div></div>
        <div class="stat"><div class="k">已累加路径和</div><div class="val blue" id="i-sum">0</div></div>
        <div class="stat"><div class="k">剩余目标</div><div class="val orange" id="i-remain">0</div></div>
        <div class="stat"><div class="k">叶子判断</div><div class="val green" id="i-leaf">—</div></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn wide" id="btnPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="playLabel">播放</span></button>
        <button class="ctrl-btn" id="btnPrev" title="上一步（←）"><svg viewBox="0 0 24 24"><path d="M16 6l-8 6 8 6z"/></svg></button>
        <button class="ctrl-btn" id="btnNext" title="下一步（→）"><svg viewBox="0 0 24 24"><path d="M8 6l-8 6-8 6z"/></svg></button>
        <button class="ctrl-btn" id="btnReset" title="重置（Home）"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
        <input type="range" id="slider" min="0" value="0">
        <span id="pcount">1 / 1</span>
        <select id="speed">
          <option value="1200">0.8x</option>
          <option value="850" selected>1x</option>
          <option value="500">1.5x</option>
          <option value="280">2.5x</option>
        </select>
      </div>
      <div class="kbd-hint">键盘：← / → 单步 · 空格 播放暂停 · Home / End 首末</div>
    </div>

    <div class="card" id="codeCard">
      <div class="card-head">Solution.java</div>
      <div class="code-wrap">
        <div class="code-inner">
          <div class="line-nums" id="lineNums"></div>
          <div class="code-lines" id="codeLines"></div>
        </div>
      </div>
      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
// ===== 用例 =====
var BIG = [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, null, 1];
var CASES = [
  { arr: BIG, target: 22, expect: true },
  { arr: [1, 2, 3], target: 5, expect: false },
  { arr: [1, 2], target: 1, expect: false },
  { arr: [1], target: 1, expect: true },
  { arr: [1], target: 2, expect: false },
  { arr: [], target: 0, expect: false },
  { arr: [-2, null, -3], target: -5, expect: true },
  { arr: BIG, target: 26, expect: true }
];

var NODE_R = 18;
function stageW() { return document.getElementById('stage').clientWidth; }
function rowY(d) { return 78 + d * 36; }

function buildTreeFromArr(arr) {
  if (!arr.length) return null;
  var root = { id: 0, val: arr[0], left: null, right: null, parent: null };
  var q = [root], i = 1;
  while (q.length && i < arr.length) {
    var n = q.shift();
    if (i < arr.length) {
      var lv = arr[i++];
      if (lv !== null) { n.left = { id: i - 1, val: lv, left: null, right: null, parent: n.id }; q.push(n.left); }
    }
    if (i < arr.length) {
      var rv = arr[i++];
      if (rv !== null) { n.right = { id: i - 1, val: rv, left: null, right: null, parent: n.id }; q.push(n.right); }
    }
  }
  return root;
}
function collect(root) {
  var all = {};
  (function walk(n, d, p) {
    if (!n) return;
    n.depth = d; n.path = p.slice(); all[n.id] = n;
    walk(n.left, d + 1, p.concat(['L']));
    walk(n.right, d + 1, p.concat(['R']));
  })(root, 0, []);
  return all;
}
function slotX(node) {
  var k = 0;
  for (var j = 0; j < node.path.length; j++) k = (k << 1) | (node.path[j] === 'R' ? 1 : 0);
  return (k + 0.5) * stageW() / Math.pow(2, node.depth);
}

// ===== 代码（10 行）=====
var CODE = [
  '<span class="t-kw">class</span> <span class="t-id">Solution</span> {',
  '    <span class="t-kw">public</span> <span class="t-type">boolean</span> <span class="t-fn">hasPathSum</span>(<span class="t-type">TreeNode</span> <span class="t-id">root</span>, <span class="t-type">int</span> <span class="t-id">targetSum</span>) {',
  '        <span class="t-kw">if</span>(<span class="t-id">root</span> == <span class="t-bool">null</span>){',
  '            <span class="t-kw">return</span> <span class="t-bool">false</span> ;',
  '        }',
  '        <span class="t-type">int</span> <span class="t-id">res</span> = <span class="t-id">targetSum</span> - <span class="t-id">root</span>.val;',
  '        <span class="t-kw">if</span>(<span class="t-id">root</span>.left == <span class="t-bool">null</span> && <span class="t-id">root</span>.right == <span class="t-bool">null</span>){',
  '            <span class="t-kw">if</span>(<span class="t-id">res</span> == <span class="t-num">0</span>){',
  '                <span class="t-kw">return</span> <span class="t-bool">true</span>;',
  '            }',
  '        }',
  '        <span class="t-kw">if</span>(<span class="t-fn">hasPathSum</span>(<span class="t-id">root</span>.left,<span class="t-id">res</span>)){',
  '            <span class="t-kw">return</span> <span class="t-bool">true</span>;',
  '        }',
  '        <span class="t-kw">if</span>(<span class="t-fn">hasPathSum</span>(<span class="t-id">root</span>.right,<span class="t-id">res</span>)){',
  '            <span class="t-kw">return</span> <span class="t-bool">true</span>;',
  '        }',
  '        <span class="t-kw">return</span> <span class="t-bool">false</span>;',
  '    }',
  '}'
];

// ===== 帧生成（DFS，snap 显式参数）=====
function buildSteps(root, target) {
  var steps = [], path = [], activeId = null, found = false,
      finalResult = false, knownRemain = {}, foundPath = [];
  function curSum() { return path.reduce(function (s, id) { return s + all[id].val; }, 0); }
  function snap(phase, line, extra) {
    extra = extra || {};
    steps.push({
      phase: phase, line: line, path: path.slice(), activeId: activeId,
      target: target,
      remain: extra.remain === undefined ? null : extra.remain,
      pathSum: curSum(),
      leaf: extra.leaf === undefined ? null : extra.leaf,
      found: found,
      result: extra.result === undefined ? null : extra.result,
      knownRemain: Object.assign({}, knownRemain),
      foundPath: foundPath.slice()
    });
  }
  snap('start', 2, { remain: target });
  if (root === null) { snap('null', 4); snap('done', 18, { result: false }); return steps; }

  function dfs(n, t) {
    if (n === null) { activeId = null; snap('null', 4); return false; }
    path.push(n.id); activeId = n.id;
    var res = t - n.val;
    knownRemain[n.id] = res;
    snap('enter', 6, { remain: res });
    if (n.left === null && n.right === null) {
      snap('leafcheck', 7, { remain: res });
      if (res === 0) {
        found = true; foundPath = path.slice();
        snap('match', 9, { remain: res, leaf: true, result: true });
        path.pop(); return true;
      }
      snap('dead', 8, { remain: res, leaf: false, result: false });
      snap('finalfalse', 18, { remain: res, result: false });
      path.pop(); return false;
    }
    activeId = n.id; snap('goleft', 12, { remain: res });
    if (dfs(n.left, res)) { path.pop(); return true; }
    activeId = n.id; snap('goright', 15, { remain: res });
    if (dfs(n.right, res)) { path.pop(); return true; }
    snap('finalfalse', 18, { remain: res, result: false });
    path.pop();
    return false;
  }
  finalResult = dfs(root, target);
  activeId = null;
  snap('done', 18, { result: finalResult });
  return steps;
}

function makeMsg(fr) {
  switch (fr.phase) {
    case 'start': return '开始递归，目标 targetSum = ' + fr.target;
    case 'enter': return '进入节点 ' + all[fr.activeId].val + '，res = target - val = ' + fr.remain;
    case 'null': return '空节点，返回 false';
    case 'leafcheck': return '节点 ' + all[fr.activeId].val + ' 是叶子，判断 res（' + fr.remain + '）是否为 0';
    case 'match': return '叶子 ' + all[fr.activeId].val + ' 的 res = 0，返回 true';
    case 'dead': return '叶子 ' + all[fr.activeId].val + ' 的 res = ' + fr.remain + ' ≠ 0，继续向下判断';
    case 'goleft': return '判断左子树 hasPathSum(left, res=' + fr.remain + ')';
    case 'goright': return '左子树返回 false，判断右子树 hasPathSum(right, res=' + fr.remain + ')';
    case 'finalfalse': return '左右都未命中，返回 false';
    case 'done': return '递归结束，结果 = ' + fr.result;
  }
}

function pathSets(ids) {
  var nodes = {}, edges = {};
  ids.forEach(function (id) { nodes[id] = true; });
  ids.forEach(function (id) {
    var par = all[id].parent;
    if (par !== null && nodes[par]) edges[par + '-' + id] = true;
  });
  return { nodes: nodes, edges: edges };
}

function setupTree() {
  Object.keys(all).forEach(function (key) {
    var id = Number(key), n = all[id];
    if (n.left) {
      var e = document.createElement('div');
      placeEdge(e, nodeCenter(id), nodeCenter(n.left.id), 'edge');
      edgeEls[id + '-' + n.left.id] = e; stage.appendChild(e);
    }
    if (n.right) {
      var e2 = document.createElement('div');
      placeEdge(e2, nodeCenter(id), nodeCenter(n.right.id), 'edge');
      edgeEls[id + '-' + n.right.id] = e2; stage.appendChild(e2);
    }
  });
  Object.keys(all).forEach(function (key) {
    var id = Number(key), p = nodeCenter(id);
    var d = document.createElement('div');
    d.style.left = (p.x - NODE_R) + 'px'; d.style.top = (p.y - NODE_R) + 'px';
    d.textContent = all[id].val; d.className = 'tnode';
    var rl = document.createElement('span');
    rl.className = 'rem-label'; rl.id = 'rl-' + id;
    d.appendChild(rl);
    nodeEls[id] = d; stage.appendChild(d);
  });
}

function renderFrame() {
  var fr = frameList[cur];
  var isMatch = (fr.phase === 'match');
  var isDead = (fr.phase === 'dead');
  var showFound = isMatch ? fr.path : (fr.phase === 'done' && fr.result ? fr.foundPath : []);
  var fset = pathSets(showFound);
  var pathEdgeKeys = {};
  for (var k = 1; k < fr.path.length; k++) pathEdgeKeys[fr.path[k - 1] + '-' + fr.path[k]] = true;

  Object.keys(edgeEls).forEach(function (ek) {
    var cls = 'edge';
    if (fset.edges[ek]) cls = 'edge found';
    else if (isDead && fr.activeId !== null && ek === all[fr.activeId].parent + '-' + fr.activeId) cls = 'edge dead';
    else if (pathEdgeKeys[ek]) cls = 'edge onpath';
    edgeEls[ek].className = cls;
  });

  Object.keys(nodeEls).forEach(function (key) {
    var id = Number(key), cls = 'tnode';
    if (fset.nodes[id]) cls = 'tnode found';
    else if (isDead && fr.activeId === id) cls = 'tnode dead';
    else if (fr.activeId === id) cls = 'tnode active';
    else if (fr.path.indexOf(id) >= 0) cls = 'tnode onpath';
    nodeEls[id].className = cls;

    var lab = document.getElementById('rl-' + id);
    if (fr.knownRemain[id] !== undefined) { lab.textContent = '剩余 ' + fr.knownRemain[id]; lab.classList.add('show'); }
    else { lab.classList.remove('show'); lab.textContent = ''; }
  });

  document.getElementById('tgtPill').innerHTML = '目标 target = <b>' + fr.target + '</b>';
  var resEl = document.getElementById('resPill');
  if (fr.result === null) resEl.innerHTML = '结果 = <b class="orange">—</b>';
  else resEl.innerHTML = '结果 = <b class="' + (fr.result ? 'orange' : 'red') + '">' + fr.result + '</b>';

  document.getElementById('i-node').textContent = fr.activeId === null ? 'null' : all[fr.activeId].val;
  document.getElementById('i-sum').textContent = fr.pathSum;
  document.getElementById('i-remain').textContent = fr.remain === null ? '—' : fr.remain;
  var leafEl = document.getElementById('i-leaf');
  if (fr.leaf === null) leafEl.textContent = '—';
  else leafEl.textContent = fr.leaf;

  document.querySelectorAll('.code-line').forEach(function (l) { l.classList.remove('hl'); });
  var hl = document.getElementById('cl-' + fr.line);
  if (hl) hl.classList.add('hl');
  document.getElementById('msg').innerHTML = makeMsg(fr);
  document.getElementById('pcount').textContent = (cur + 1) + ' / ' + frameList.length;
  var slider = document.getElementById('slider');
  slider.max = frameList.length - 1; slider.value = cur;
  document.getElementById('btnPrev').disabled = (cur === 0);
  document.getElementById('btnNext').disabled = (cur === frameList.length - 1);
}

// ===== 运行状态 =====
var stage = document.getElementById('stage');
var all = {}, frameList = [], nodeEls = {}, edgeEls = {};
var cur = 0, timer = null, playing = false, curCase = 0;
function nodeCenter(id) { return { x: slotX(all[id]), y: rowY(all[id].depth) }; }
function placeEdge(el, p1, p2, cls) {
  var dx = p2.x - p1.x, dy = p2.y - p1.y;
  var len = Math.hypot(dx), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  el.style.left = p1.x + 'px'; el.style.top = p1.y + 'px';
  el.style.width = len + 'px'; el.style.transform = 'rotate(' + ang + 'deg)';
  el.className = cls || 'edge';
}
function clearDynamic() {
  [nodeEls, edgeEls].forEach(function (m) {
    Object.keys(m).forEach(function (k) { m[k].remove(); });
  });
  nodeEls = {}; edgeEls = {};
}
function compute(idx) {
  var c = CASES[idx];
  var root = buildTreeFromArr(c.arr);
  all = collect(root);
  frameList = buildSteps(root, c.target);
}

// ===== 播放控制 =====
function setPlaying(on) {
  playing = on;
  document.getElementById('playLabel').textContent = on ? '暂停' : '播放';
  document.querySelector('#btnPlay svg').innerHTML = on
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}
function play() {
  setPlaying(true);
  timer = setInterval(function () {
    if (cur >= frameList.length - 1) { stop(); return; }
    cur++; renderFrame();
  }, Number(document.getElementById('speed').value));
}
function stop() {
  setPlaying(false);
  if (timer) { clearInterval(timer); timer = null; }
}
function nextStep() { if (cur < frameList.length - 1) { cur++; renderFrame(); } }
function prevStep() { if (cur > 0) { cur--; renderFrame(); } }

function switchCase(idx) {
  stop(); curCase = idx; cur = 0;
  clearDynamic();
  compute(idx);
  setupTree();
  renderFrame();
  document.querySelectorAll('.case-btn').forEach(function (b, i) {
    b.classList.toggle('active', i === idx);
  });
}
function renderCode() {
  document.getElementById('lineNums').innerHTML = CODE.map(function (_, i) { return i + 1; }).join('<br>');
  document.getElementById('codeLines').innerHTML = CODE.map(function (c, i) {
    return '<div class="code-line" id="cl-' + (i + 1) + '">' + c + '</div>';
  }).join('');
}
function renderCases() {
  var box = document.getElementById('cases');
  CASES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'case-btn' + (i === 0 ? ' active' : '');
    b.textContent = '用例 ' + (i + 1) + '：target=' + c.target;
    b.onclick = function () { switchCase(i); };
    box.appendChild(b);
  });
}

document.getElementById('btnPlay').onclick = function () { playing ? stop() : play(); };
document.getElementById('btnNext').onclick = nextStep;
document.getElementById('btnPrev').onclick = prevStep;
document.getElementById('btnReset').onclick = function () { stop(); cur = 0; renderFrame(); };
document.getElementById('slider').addEventListener('input', function (e) {
  stop(); cur = Number(e.target.value); renderFrame();
});
document.getElementById('speed').onchange = function () { if (playing) { stop(); play(); } };
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stop(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
  else if (e.key === 'Home') { e.preventDefault(); stop(); cur = 0; renderFrame(); }
  else if (e.key === 'End') { e.preventDefault(); stop(); cur = frameList.length - 1; renderFrame(); }
});

renderCode();
renderCases();
compute(0);
setupTree();
renderFrame();
</script>
</body>
</html>
