<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>240. 搜索二维矩阵 II · 右上角 Z 字形可视化</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d1117'/%3E%3Ccircle cx='7' cy='7' r='2.5' fill='%2358a6ff'/%3E%3Ccircle cx='17' cy='17' r='2.5' fill='%233fb950'/%3E%3Cpath d='M9 7h6M7 9v6' stroke='%23e3b341' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;
  --orange:#e3b341;--purple:#bc8cff;--red:#f85149
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.6;padding:28px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--orange);color:var(--orange)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:18px}
.intro{border-left:3px solid var(--blue)}
.intro p{font-size:14.5px}
.intro b{color:var(--blue)}
.cases{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.case-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.case-btn:hover{border-color:var(--blue);color:var(--text)}
.case-btn.active{background:rgba(88,166,255,.14);border-color:var(--blue);color:var(--blue);font-weight:600}

.viz-title{font-size:15px;font-weight:600;margin-bottom:14px}
.viz-scroll{overflow:auto;max-width:100%}
.m-wrap{display:inline-block}
.col-nums{display:grid;gap:8px;margin-bottom:8px;margin-left:34px}
.cn{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-family:Consolas,monospace}
.m-grid-area{display:flex;gap:8px}
.row-nums{display:grid;gap:8px}
.rn{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-family:Consolas,monospace}
.matrix-grid{display:grid;gap:8px}
.m-cell{width:58px;height:58px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;font-family:Consolas,monospace;position:relative;transition:all .25s}
.m-cell.excluded{opacity:.28;background:#11161d}
.m-cell.p-left{border-color:var(--blue);background:rgba(88,166,255,.14)}
.m-cell.p-down{border-color:var(--purple);background:rgba(188,140,255,.14)}
.m-cell.cur{border:2px solid #fff;transform:scale(1.08);z-index:2;box-shadow:0 0 16px rgba(255,255,255,.25)}
.m-cell.found{border:2px solid var(--green);background:rgba(63,185,80,.25);box-shadow:0 0 18px rgba(63,185,80,.5);z-index:2}
.m-cell .arrow{position:absolute;top:3px;right:4px;width:13px;height:13px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw-dot{width:13px;height:13px;border-radius:4px}

.info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.bi{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-align:center}
.bi .k{font-size:12px;color:var(--muted)}
.bi .v{font-size:17px;font-weight:700;margin-top:2px;font-family:Consolas,monospace}
.msg{margin-top:16px;font-size:14px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.msg .act{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;margin-right:8px}
.act.a-left{background:rgba(88,166,255,.18);color:var(--blue)}
.act.a-down{background:rgba(188,140,255,.18);color:var(--purple)}
.act.a-found{background:rgba(63,185,80,.18);color:var(--green)}
.act.a-notfound{background:rgba(248,81,73,.18);color:var(--red)}
.act.a-start{background:rgba(139,148,158,.18);color:var(--muted)}

.code-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:18px}
.code-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.dot{width:12px;height:12px;border-radius:50%}
.cdot1{background:var(--red)}.cdot2{background:var(--orange)}.cdot3{background:var(--green)}
.code-fname{margin-left:8px;font-size:13px;color:var(--muted)}
.code-body{padding:12px 0;overflow:auto;max-height:430px}
.code-line{display:flex;align-items:flex-start;padding:1.5px 14px;font-family:Consolas,monospace;font-size:13.5px;white-space:pre}
.code-line .ln{width:26px;text-align:right;color:#48505c;margin-right:14px;flex-shrink:0;user-select:none}
.code-line.hl{background:rgba(88,166,255,.16)}
.code-line.hl .ln{color:var(--blue)}
.t-kw{color:#ff7b72}.t-type{color:#79c0ff}.t-num{color:#a5d6ff}.t-meth{color:#d2a8ff}

.controls{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.btn:hover{border-color:var(--blue)}
.btn.play{width:auto;padding:0 20px;gap:8px;background:var(--blue);border-color:var(--blue);color:#0d1117;font-weight:700;font-size:14px}
.btn.play:hover{filter:brightness(1.1)}
.btn svg{width:18px;height:18px;fill:currentColor}
.scrub{flex:1;min-width:140px;accent-color:var(--blue);height:6px}
.step-txt{font-size:13px;color:var(--muted);font-family:Consolas,monospace;min-width:56px;text-align:right}
.speed{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;font-family:inherit}
@media(max-width:760px){
  .info{grid-template-columns:repeat(2,1fr)}
  .m-cell{width:44px;height:44px;font-size:14px}
  body{padding:18px 12px 50px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>240. 搜索二维矩阵 II <span class="tag">中等</span></h1>
  <div class="sub">右上角 Z 字形搜索 · 时间 O(m+n) · 空间 O(1)</div>

  <div class="panel intro">
    <p>从<b>右上角</b>出发：当前值比 target 大就往左（排除整列），比 target 小就往下（排除整行），每步排除一整行或一整列。被排除的格子变暗，路径按方向着色，直到找到或越界。</p>
  </div>

  <div class="cases" id="caseBox"></div>

  <div class="panel">
    <div class="viz-title">矩阵（行、列均升序；白框为当前格，暗色格已被排除）</div>
    <div class="viz-scroll">
      <div class="m-wrap">
        <div class="col-nums" id="colNums"></div>
        <div class="m-grid-area">
          <div class="row-nums" id="rowNums"></div>
          <div class="matrix-grid" id="matrixGrid"></div>
        </div>
      </div>
    </div>
    <div class="legend">
      <span><span class="sw-dot" style="border:1px solid var(--blue)"></span>往左（排除列）</span>
      <span><span class="sw-dot" style="border:1px solid var(--purple)"></span>往下（排除行）</span>
      <span><span class="sw-dot" style="border:1px solid var(--green)"></span>找到</span>
    </div>
    <div class="info">
      <div class="bi"><div class="k">target</div><div class="v" id="iTarget">—</div></div>
      <div class="bi"><div class="k">当前位置</div><div class="v" id="iPos">—</div></div>
      <div class="bi"><div class="k">当前值</div><div class="v" id="iVal">—</div></div>
      <div class="bi"><div class="k">结果</div><div class="v" id="iResult" style="font-size:15px">—</div></div>
    </div>
    <div class="msg" id="msgBox"></div>
  </div>

  <div class="code-panel">
    <div class="code-bar"><span class="dot cdot1"></span><span class="dot cdot2"></span><span class="dot cdot3"></span><span class="code-fname">Solution.java</span></div>
    <div class="code-body" id="codeBody"></div>
  </div>

  <div class="controls">
    <button class="btn play" id="playBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="playTxt">播放</span>
    </button>
    <button class="btn" id="prevBtn" title="上一步（左箭头）"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="btn" id="nextBtn" title="下一步（右箭头）"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="btn" id="resetBtn" title="重置"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <input type="range" class="scrub" id="scrub" min="0" max="0" value="0">
    <span class="step-txt" id="stepTxt">0 / 0</span>
    <select class="speed" id="speedSel">
      <option value="1000">0.5x</option>
      <option value="600" selected>1x</option>
      <option value="320">2x</option>
      <option value="170">4x</option>
    </select>
  </div>
</div>

<script>
const MAT=[[1,4,7,11,15],[2,5,8,12,19],[3,6,9,16,22]];
const CASES=[
  {target:5,label:'target=5 找到'},
  {target:20,label:'target=20 找不到'},
  {target:1,label:'target=1 左上角'},
  {target:22,label:'target=22 右下角'},
  {target:15,label:'target=15 起点'},
  {target:13,label:'target=13 找不到'}
];

const CODE_HTML=[
  '<span class="t-kw">class</span> <span class="t-type">Solution</span> {',
  '  <span class="t-kw">public</span> <span class="t-kw">boolean</span> <span class="t-meth">searchMatrix</span>(<span class="t-kw">int</span>[][] matrix, <span class="t-kw">int</span> target) {',
  '    <span class="t-kw">int</span> startRow = <span class="t-num">0</span>;',
  '    <span class="t-kw">int</span> startCol = matrix[<span class="t-num">0</span>].length-<span class="t-num">1</span>;',
  '    <span class="t-kw">while</span>(startCol&gt;=<span class="t-num">0</span> &amp;&amp; startRow&lt;matrix.length){',
  '      <span class="t-kw">if</span>(matrix[startRow][startCol]==target)',
  '        <span class="t-kw">return</span> <span class="t-kw">true</span>;',
  '      <span class="t-kw">else if</span>(matrix[startRow][startCol]&lt;target)',
  '        ++startRow;',
  '      <span class="t-kw">else if</span>(matrix[startRow][startCol]&gt;target)',
  '        --startCol;',
  '    }',
  '    <span class="t-kw">return</span> <span class="t-kw">false</span>;',
  '  }',
  '}'
];
const ARROW={
  left:'<svg class="arrow" viewBox="0 0 24 24" fill="#58a6ff"><path d="M20 11H7l5-5-1.5-1.5L3 12l7.5 7.5L12 18l-5-5h13z"/></svg>',
  down:'<svg class="arrow" viewBox="0 0 24 24" fill="#bc8cff"><path d="M11 4v13l-5-5-1.5 1.5L12 21l7.5-7.5L18 12l-5 5V4z"/></svg>'
};

function buildSteps(c){
  const target=c.target;
  const n=MAT.length,m=MAT[0].length;
  let hang=0,lie=m-1;
  const path=[];
  const excludedRows=new Set(),excludedCols=new Set();
  const steps=[];
  const snap=(o)=>steps.push(Object.assign({
    line:0,hang,lie,target,path:path.map(p=>({pos:p.pos,dir:p.dir})),
    excludedRows:new Set(excludedRows),excludedCols:new Set(excludedCols),
    action:'',msg:''
  },o));

  snap({line:5,action:'start',
    msg:'从右上角 (0,'+(m-1)+') 开始，target='+target});

  while(lie>=0&&hang<n){
    path.push({pos:[hang,lie],dir:null});
    const v=MAT[hang][lie];
    if(v>target){
      path[path.length-1].dir='left';
      excludedCols.add(lie);
      snap({line:11,action:'left',
        msg:'matrix['+hang+']['+lie+']='+v+' &gt; '+target+'，第'+lie+'列下方都更大，排除整列，往左'});
      lie--;
    }else if(v<target){
      path[path.length-1].dir='down';
      excludedRows.add(hang);
      snap({line:9,action:'down',
        msg:'matrix['+hang+']['+lie+']='+v+' &lt; '+target+'，第'+hang+'行左边都更小，排除整行，往下'});
      hang++;
    }else{
      path[path.length-1].dir='found';
      snap({line:7,action:'found',
        msg:'matrix['+hang+']['+lie+']='+v+' == target，找到，返回 true'});
      return steps;
    }
  }
  snap({line:13,action:'notfound',
    msg:'指针越界仍未找到 target='+target+'，返回 false'});
  return steps;
}

let caseIdx=0,steps=[],posIdx=0,timer=null,playing=false;
const $=(id)=>document.getElementById(id);

function renderCaseButtons(){
  $('caseBox').innerHTML=CASES.map((c,i)=>
    '<button class="case-btn'+(i===caseIdx?' active':'')+'" data-k="'+i+'">用例 '+(i+1)+': '+c.label+'</button>').join('');
  document.querySelectorAll('.case-btn').forEach(b=>b.addEventListener('click',
    ()=>loadCase(parseInt(b.dataset.k,10))));
}
function renderMatrix(snap){
  const n=MAT.length,m=MAT[0].length;
  $('colNums').style.gridTemplateColumns='repeat('+m+',58px)';
  $('rowNums').style.gridTemplateRows='repeat('+n+',58px)';
  $('matrixGrid').style.gridTemplateColumns='repeat('+m+',58px)';
  $('matrixGrid').style.gridTemplateRows='repeat('+n+',58px)';
  $('colNums').innerHTML=Array.from({length:m},(_,j)=>'<div class="cn">'+j+'</div>').join('');
  $('rowNums').innerHTML=Array.from({length:n},(_,i)=>'<div class="rn">'+i+'</div>').join('');

  const pathMap={};
  snap.path.forEach((p,idx)=>{pathMap[p.pos[0]+'-'+p.pos[1]]={dir:p.dir,idx};});
  const lastIdx=snap.path.length-1;
  $('matrixGrid').innerHTML=MAT.map((row,i)=>row.map((v,j)=>{
    const k=i+'-'+j;
    let cls='m-cell';
    if(snap.excludedRows.has(i)||snap.excludedCols.has(j))cls+=' excluded';
    const pp=pathMap[k];
    if(pp){
      if(pp.dir==='left')cls+=' p-left';
      else if(pp.dir==='down')cls+=' p-down';
      else if(pp.dir==='found')cls+=' found';
      if(pp.idx===lastIdx&&snap.action!=='notfound'&&pp.dir!=='found')cls+=' cur';
    }
    let arrow='';
    if(pp&&pp.idx===lastIdx&&snap.action!=='notfound'){
      if(pp.dir==='left')arrow=ARROW.left;
      else if(pp.dir==='down')arrow=ARROW.down;
    }
    return '<div class="'+cls+'">'+v+arrow+'</div>';
  }).join('')).join('');
}
function renderCode(){
  $('codeBody').innerHTML=CODE_HTML.map((h,i)=>
    '<div class="code-line" data-line="'+(i+1)+'"><span class="ln">'+(i+1)+'</span><span>'+h+'</span></div>').join('');
}
function render(){
  const snap=steps[posIdx];
  renderMatrix(snap);
  $('iTarget').textContent=snap.target;
  const last=snap.path[snap.path.length-1];
  $('iPos').textContent=last?('['+last.pos[0]+','+last.pos[1]+']'):'—';
  $('iVal').textContent=last?MAT[last.pos[0]][last.pos[1]]:'—';
  const resName={start:'开始',left:'往左',down:'往下',found:'true 找到',notfound:'false 未找到'}[snap.action];
  $('iResult').textContent=resName;
  const actName={start:'开始',left:'往左',down:'往下',found:'找到',notfound:'未找到'}[snap.action];
  $('msgBox').innerHTML='<span class="act a-'+snap.action+'">'+actName+'</span>'+snap.msg;
  $('codeBody').querySelectorAll('.code-line').forEach(el=>
    el.classList.toggle('hl',parseInt(el.dataset.line,10)===snap.line));
  $('scrub').max=steps.length-1;$('scrub').value=posIdx;
  $('stepTxt').textContent=posIdx+' / '+(steps.length-1);
  const hlEl=$('codeBody').querySelector('.code-line.hl');
  if(hlEl)hlEl.scrollIntoView({block:'nearest'});
}
function pause(){
  playing=false;clearInterval(timer);timer=null;
  $('playTxt').textContent='播放';
  $('playBtn').querySelector('svg').innerHTML='<path d="M8 5v14l11-7z"/>';
}
function play(){
  if(playing){pause();return;}
  playing=true;$('playTxt').textContent='暂停';
  $('playBtn').querySelector('svg').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  if(posIdx>=steps.length-1){posIdx=0;render();}
  timer=setInterval(()=>{
    if(posIdx>=steps.length-1){pause();return;}
    posIdx++;render();
  },parseInt($('speedSel').value,10));
}
function loadCase(k){
  pause();caseIdx=k;posIdx=0;
  steps=buildSteps(CASES[k]);
  renderCaseButtons();render();
}
$('playBtn').addEventListener('click',play);
$('prevBtn').addEventListener('click',()=>{pause();if(posIdx>0){posIdx--;render();}});
$('nextBtn').addEventListener('click',()=>{pause();if(posIdx<steps.length-1){posIdx++;render();}});
$('resetBtn').addEventListener('click',()=>{pause();posIdx=0;render();});
$('scrub').addEventListener('input',()=>{pause();posIdx=parseInt($('scrub').value,10);render();});
$('speedSel').addEventListener('change',()=>{if(playing){pause();play();}});
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();if(posIdx<steps.length-1){posIdx++;render();}}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(posIdx>0){posIdx--;render();}}
  else if(e.key===' '){e.preventDefault();play();}
});
renderCode();steps=buildSteps(CASES[0]);renderCaseButtons();render();
</script>
</body>
</html>
