<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>48. 旋转图像 · 转置翻转可视化</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d1117'/%3E%3Cpath d='M4 12a8 8 0 1 1 8 8' fill='none' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M12 8l4 4-4 4' fill='none' stroke='%23e3b341' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;
  --orange:#e3b341;--purple:#bc8cff;--red:#f85149
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.6;padding:28px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid var(--orange);color:var(--orange)}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:18px}
.intro{border-left:3px solid var(--blue)}
.intro p{font-size:14.5px}
.intro b{color:var(--blue)}
.cases{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.case-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.case-btn:hover{border-color:var(--blue);color:var(--text)}
.case-btn.active{background:rgba(88,166,255,.14);border-color:var(--blue);color:var(--blue);font-weight:600}

.stage-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px;transition:.2s;min-width:0;position:relative}
.sc .snum{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.sc .sname{font-size:15px;font-weight:600;margin-top:4px}
.sc .sdesc{font-size:12.5px;color:var(--muted);margin-top:4px}
.sc.s1{border-color:var(--blue)} .sc.s1 .snum{color:var(--blue)}
.sc.s2{border-color:var(--orange)} .sc.s2 .snum{color:var(--orange)}
.sc.on{box-shadow:0 0 0 1px currentColor}
.sc.done{opacity:.6}
.sc .tick{position:absolute;top:12px;right:12px;width:16px;height:16px;display:none}
.sc.done .tick{display:block}

.viz-title{font-size:15px;font-weight:600;margin-bottom:16px}
.viz-scroll{overflow:auto;max-width:100%}
.matrix-grid{display:grid;gap:8px}
.m-cell{width:60px;height:60px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;font-family:Consolas,monospace;transition:all .25s}
.m-cell.diag{border-style:dashed;border-color:var(--purple);color:var(--purple)}
.m-cell.done-blue{border-color:var(--blue);background:rgba(88,166,255,.12)}
.m-cell.done-orange{border-color:var(--orange);background:rgba(227,179,65,.12)}
.m-cell.cur-blue{border:2px solid var(--blue);background:rgba(88,166,255,.25);transform:scale(1.08);z-index:2;box-shadow:0 0 14px rgba(88,166,255,.4)}
.m-cell.cur-orange{border:2px solid var(--orange);background:rgba(227,179,65,.25);transform:scale(1.08);z-index:2;box-shadow:0 0 14px rgba(227,179,65,.4)}

.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw-dot{width:13px;height:13px;border-radius:4px}

.info{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.info-card{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 14px}
.info-card .k{font-size:12px;color:var(--muted)}
.info-card .v{font-size:15px;font-weight:600;margin-top:3px;font-family:Consolas,monospace}
.msg{margin-top:14px;font-size:14px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.msg .act{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;margin-right:8px}
.act.a1{background:rgba(88,166,255,.18);color:var(--blue)}
.act.a2{background:rgba(227,179,65,.18);color:var(--orange)}
.act.a0{background:rgba(139,148,158,.18);color:var(--muted)}

.code-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:18px}
.code-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.dot{width:12px;height:12px;border-radius:50%}
.cdot1{background:var(--red)}.cdot2{background:var(--orange)}.cdot3{background:var(--green)}
.code-fname{margin-left:8px;font-size:13px;color:var(--muted)}
.code-body{padding:12px 0;overflow:auto;max-height:440px}
.code-line{display:flex;align-items:flex-start;padding:1.5px 14px;font-family:Consolas,monospace;font-size:13.5px;white-space:pre}
.code-line .ln{width:26px;text-align:right;color:#48505c;margin-right:14px;flex-shrink:0;user-select:none}
.code-line.hl{background:rgba(88,166,255,.16)}
.code-line.hl .ln{color:var(--blue)}
.t-kw{color:#ff7b72}.t-type{color:#79c0ff}.t-num{color:#a5d6ff}.t-meth{color:#d2a8ff}

.controls{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.btn:hover{border-color:var(--blue)}
.btn.play{width:auto;padding:0 20px;gap:8px;background:var(--blue);border-color:var(--blue);color:#0d1117;font-weight:700;font-size:14px}
.btn.play:hover{filter:brightness(1.1)}
.btn svg{width:18px;height:18px;fill:currentColor}
.scrub{flex:1;min-width:140px;accent-color:var(--blue);height:6px}
.step-txt{font-size:13px;color:var(--muted);font-family:Consolas,monospace;min-width:56px;text-align:right}
.speed{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;font-family:inherit}
@media(max-width:760px){
  .stage-cards{grid-template-columns:1fr}
  .m-cell{width:46px;height:46px;font-size:15px}
  body{padding:18px 12px 50px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>48. 旋转图像 <span class="tag">中等</span></h1>
  <div class="sub">原地顺时针旋转 90 度 · 时间 O(n²) · 空间 O(1)</div>

  <div class="panel intro">
    <p>两步完成原地旋转：先沿<b>主对角线转置</b>（交换对称位置，对角线不动），再把<b>每一行左右翻转</b>。坐标上 <b>matrix[i][j] 先到 [j][i]，再到 [j][n-1-i]</b>，正好是顺时针旋转 90 度的目标位置。</p>
  </div>

  <div class="cases" id="caseBox"></div>
  <div class="stage-cards" id="stageBox"></div>

  <div class="panel">
    <div class="viz-title">方阵（虚线紫格为主对角线，转置时不动；高亮格为当前交换对）</div>
    <div class="viz-scroll"><div class="matrix-grid" id="matrixGrid"></div></div>
    <div class="legend">
      <span><span class="sw-dot" style="border:1px solid var(--blue)"></span>转置交换</span>
      <span><span class="sw-dot" style="border:1px solid var(--orange)"></span>行翻转交换</span>
      <span><span class="sw-dot" style="border:1px dashed var(--purple)"></span>主对角线不动</span>
    </div>
    <div class="info">
      <div class="info-card"><div class="k">当前阶段</div><div class="v" id="iStage">—</div></div>
      <div class="info-card"><div class="k">交换对</div><div class="v" id="iPair" style="font-size:13px">—</div></div>
      <div class="info-card"><div class="k">动作</div><div class="v" id="iAct">—</div></div>
    </div>
    <div class="msg" id="msgBox"></div>
  </div>

  <div class="code-panel">
    <div class="code-bar"><span class="dot cdot1"></span><span class="dot cdot2"></span><span class="dot cdot3"></span><span class="code-fname">Solution.java</span></div>
    <div class="code-body" id="codeBody"></div>
  </div>

  <div class="controls">
    <button class="btn play" id="playBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="playTxt">播放</span>
    </button>
    <button class="btn" id="prevBtn" title="上一步（左箭头）"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="btn" id="nextBtn" title="下一步（右箭头）"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="btn" id="resetBtn" title="重置"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <input type="range" class="scrub" id="scrub" min="0" max="0" value="0">
    <span class="step-txt" id="stepTxt">0 / 0</span>
    <select class="speed" id="speedSel">
      <option value="1000">0.5x</option>
      <option value="600" selected>1x</option>
      <option value="320">2x</option>
      <option value="170">4x</option>
    </select>
  </div>
</div>

<script>
const CASES=[
  {mat:[[1,2,3],[4,5,6],[7,8,9]],label:'3x3 标准'},
  {mat:[[1,2],[3,4]],label:'2x2'},
  {mat:[[5,1,9,11],[2,4,8,10],[13,3,6,7],[15,14,12,16]],label:'4x4'},
  {mat:[[1]],label:'1x1'}
];

const CODE_HTML=[
  '<span class="t-kw">class</span> <span class="t-type">Solution</span> {',
  '  <span class="t-kw">public</span> <span class="t-kw">void</span> <span class="t-meth">rotate</span>(<span class="t-kw">int</span>[][] matrix) {',
  '    <span class="t-kw">if</span> (matrix.length==<span class="t-num">0</span> || matrix[<span class="t-num">0</span>].length!=matrix.length) <span class="t-kw">return</span>;',
  '    <span class="t-kw">int</span> nums = matrix.length;',
  '    <span class="t-kw">for</span> (<span class="t-kw">int</span> i = <span class="t-num">0</span>; i &lt; nums; i++) {',
  '      <span class="t-kw">for</span> (<span class="t-kw">int</span> j = i + <span class="t-num">1</span>; j &lt; nums; j++) {',
  '        <span class="t-kw">int</span> temp = matrix[i][j];',
  '        matrix[i][j] = matrix[j][i];',
  '        matrix[j][i] = temp;',
  '      }',
  '    }',
  '    <span class="t-kw">for</span> (<span class="t-kw">int</span> i = <span class="t-num">0</span>; i &lt; nums; i++) {',
  '      <span class="t-kw">int</span> left = <span class="t-num">0</span>;',
  '      <span class="t-kw">int</span> right = matrix.length - <span class="t-num">1</span>;',
  '      <span class="t-kw">while</span> (right &gt; left) {',
  '        <span class="t-kw">int</span> temp = matrix[i][right];',
  '        matrix[i][right] = matrix[i][left];',
  '        matrix[i][left] = temp;',
  '        right--;',
  '        left++;',
  '      }',
  '    }',
  '  }',
  '}'
];

const STAGE_DEFS=[
  {cls:'s1',name:'沿主对角线转置',desc:'交换 matrix[i][j] 与 matrix[j][i]，j 从 i+1 开始'},
  {cls:'s2',name:'每行左右翻转',desc:'双指针交换每行两端，直到相遇'}
];

function buildSteps(c){
  const matrix=c.mat.map(r=>r.slice());
  const n=matrix.length;
  const steps=[];
  const snap=(o)=>steps.push(Object.assign({
    line:0,phase:0,matrix:matrix.map(r=>r.slice()),
    pair:null,processed:new Set(),action:'',msg:''
  },o));

  snap({line:2,action:'init',
    msg:'n='+n+'，方阵原地旋转。第一步沿主对角线转置，第二步每行左右翻转'});

  const processed=new Set();
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const t=matrix[i][j];matrix[i][j]=matrix[j][i];matrix[j][i]=t;
      processed.add(i+'-'+j);processed.add(j+'-'+i);
      snap({line:8,phase:1,pair:[[i,j],[j,i]],processed:new Set(processed),action:'swap',
        msg:'转置：交换 matrix['+i+']['+j+'] 与 matrix['+j+']['+i+']（关于主对角线对称）'});
    }
  }
  snap({line:12,phase:1,processed:new Set(processed),action:'phaseend',
    msg:'转置完成，主对角线元素保持不动，接下来把每行左右翻转'});

  const done2=new Set();
  for(let i=0;i<n;i++){
    let left=0,right=n-1;
    while(right>left){
      const t=matrix[i][right];matrix[i][right]=matrix[i][left];matrix[i][left]=t;
      done2.add(i+'-'+left);done2.add(i+'-'+right);
      snap({line:18,phase:2,pair:[[i,left],[i,right]],processed:new Set(done2),action:'swap',
        msg:'第 '+i+' 行翻转：交换左右两端 matrix['+i+']['+left+'] 与 matrix['+i+']['+right+']'});
      left++;right--;
    }
  }
  snap({line:0,phase:2,action:'end',
    msg:'每行翻转完成，矩阵已顺时针旋转 90 度'});
  return steps;
}

let caseIdx=0,steps=[],posIdx=0,timer=null,playing=false;
const $=(id)=>document.getElementById(id);

function renderCaseButtons(){
  $('caseBox').innerHTML=CASES.map((c,i)=>
    '<button class="case-btn'+(i===caseIdx?' active':'')+'" data-k="'+i+'">用例 '+(i+1)+': '+c.label+'</button>').join('');
  document.querySelectorAll('.case-btn').forEach(b=>b.addEventListener('click',
    ()=>loadCase(parseInt(b.dataset.k,10))));
}
function renderStageCards(snap){
  $('stageBox').innerHTML=STAGE_DEFS.map((s,i)=>{
    const cur=snap.phase===i+1&&snap.action!=='phaseend';
    const done=snap.phase>i+1||(snap.phase===2&&(snap.action==='end'||snap.action==='swap'));
    return '<div class="sc '+s.cls+(cur?' on':'')+(done?' done':'')+'">'+
      '<svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<div class="snum">STEP '+(i+1)+'</div><div class="sname">'+s.name+'</div>'+
      '<div class="sdesc">'+s.desc+'</div></div>';
  }).join('');
}
function renderMatrix(snap){
  const n=CASES[caseIdx].mat.length;
  $('matrixGrid').style.gridTemplateColumns='repeat('+n+',60px)';
  $('matrixGrid').style.gridTemplateRows='repeat('+n+',60px)';
  $('matrixGrid').innerHTML=snap.matrix.map((row,i)=>row.map((v,j)=>{
    let cls='m-cell';const k=i+'-'+j;
    if(snap.phase===1&&i===j)cls+=' diag';
    if(snap.phase===1){
      if(snap.processed.has(k))cls+=' done-blue';
      if(snap.pair&&snap.pair.some(p=>p[0]===i&&p[1]===j))cls+=' cur-blue';
    }else if(snap.phase===2){
      if(snap.processed.has(k))cls+=' done-orange';
      if(snap.pair&&snap.pair.some(p=>p[0]===i&&p[1]===j))cls+=' cur-orange';
    }
    return '<div class="'+cls+'">'+v+'</div>';
  }).join('')).join('');
}
function renderCode(){
  $('codeBody').innerHTML=CODE_HTML.map((h,i)=>
    '<div class="code-line" data-line="'+(i+1)+'"><span class="ln">'+(i+1)+'</span><span>'+h+'</span></div>').join('');
}
function render(){
  const snap=steps[posIdx];
  renderStageCards(snap);renderMatrix(snap);
  $('iStage').textContent=snap.phase?('第 '+snap.phase+' 步'):'准备';
  $('iPair').textContent=snap.pair?('['+snap.pair[0]+'] ↔ ['+snap.pair[1]+']'):'—';
  const actName={init:'初始化',swap:'交换',phaseend:'阶段完成',end:'完成'}[snap.action];
  const cls=snap.phase?('a'+snap.phase):'a0';
  $('iAct').textContent=actName;
  $('msgBox').innerHTML='<span class="act '+cls+'">'+actName+'</span>'+snap.msg;
  $('codeBody').querySelectorAll('.code-line').forEach(el=>
    el.classList.toggle('hl',parseInt(el.dataset.line,10)===snap.line));
  $('scrub').max=steps.length-1;$('scrub').value=posIdx;
  $('stepTxt').textContent=posIdx+' / '+(steps.length-1);
  const hlEl=$('codeBody').querySelector('.code-line.hl');
  if(hlEl)hlEl.scrollIntoView({block:'nearest'});
}
function pause(){
  playing=false;clearInterval(timer);timer=null;
  $('playTxt').textContent='播放';
  $('playBtn').querySelector('svg').innerHTML='<path d="M8 5v14l11-7z"/>';
}
function play(){
  if(playing){pause();return;}
  playing=true;$('playTxt').textContent='暂停';
  $('playBtn').querySelector('svg').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  if(posIdx>=steps.length-1){posIdx=0;render();}
  timer=setInterval(()=>{
    if(posIdx>=steps.length-1){pause();return;}
    posIdx++;render();
  },parseInt($('speedSel').value,10));
}
function loadCase(k){
  pause();caseIdx=k;posIdx=0;
  steps=buildSteps(CASES[k]);
  renderCaseButtons();render();
}
$('playBtn').addEventListener('click',play);
$('prevBtn').addEventListener('click',()=>{pause();if(posIdx>0){posIdx--;render();}});
$('nextBtn').addEventListener('click',()=>{pause();if(posIdx<steps.length-1){posIdx++;render();}});
$('resetBtn').addEventListener('click',()=>{pause();posIdx=0;render();});
$('scrub').addEventListener('input',()=>{pause();posIdx=parseInt($('scrub').value,10);render();});
$('speedSel').addEventListener('change',()=>{if(playing){pause();play();}});
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){e.preventDefault();if(posIdx<steps.length-1){posIdx++;render();}}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(posIdx>0){posIdx--;render();}}
  else if(e.key===' '){e.preventDefault();play();}
});
renderCode();steps=buildSteps(CASES[0]);renderCaseButtons();render();
</script>
</body>
</html>
