<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>M</text></svg>">
<title>155. 最小栈 · 双栈可视化</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e;
    --blue:#58a6ff; --green:#3fb950; --orange:#d29922; --red:#f85149; --purple:#bc8cff;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:14px;line-height:1.6;overflow:hidden;height:100vh;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;
  }
  h1{font-size:18px}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--muted);border:none;padding:7px 11px;cursor:pointer;font-family:var(--mono);font-size:11.5px}
  .seg button.on{background:var(--blue);color:#fff}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .btn:hover{background:#272e3a}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 6px;font-size:12px}
  .progress-bar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
  .pl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  input[type=range]{flex:1;accent-color:var(--blue)}
  main{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14px;padding:14px 20px;overflow:hidden}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;font-family:var(--mono);color:var(--muted)}
  .dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;flex:1;align-content:start}
  .stack-col{display:flex;flex-direction:column;align-items:center}
  .stack-name{font-family:var(--mono);font-size:11px;margin-bottom:10px;text-align:center;line-height:1.4}
  .stack-name.main{color:var(--blue)} .stack-name.min{color:var(--green)}
  .vstack{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;width:100%}
  .cell{
    font-family:var(--mono);font-size:15px;width:64px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;border:1px solid var(--border);background:var(--panel2);animation:pop .25s ease;position:relative;
  }
  .cell.main{color:var(--blue);border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.12)}
  .cell.min{color:var(--green);border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.12)}
  .cell.is-top{font-weight:700;box-shadow:0 0 0 1px currentColor}
  .cell.min.is-top::after{content:'最小';position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8.5px;background:var(--green);color:#04140a;padding:1px 5px;border-radius:4px}
  .ghost{
    font-family:var(--mono);font-size:15px;width:64px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:6px;border:1px dashed var(--red);color:var(--red);opacity:.65;animation:ghost .5s ease;
  }
  .base{width:74px;height:5px;background:var(--border);border-radius:3px;margin-top:8px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes ghost{from{opacity:0;transform:translateY(8px)}to{opacity:.65;transform:translateY(0)}}
  .rightCol{display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .state-body{padding:13px 14px;display:flex;flex-direction:column;gap:11px}
  .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .meta{background:var(--panel2);border-radius:6px;padding:8px 5px;text-align:center;border:1px solid var(--border)}
  .meta .lbl{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .meta .val{font-size:14px;font-weight:700;font-family:var(--mono);margin-top:3px}
  .desc{background:var(--panel2);padding:9px 11px;border-radius:6px;border-left:3px solid var(--blue);font-size:12.5px;line-height:1.6}
  .desc.warn{border-left-color:var(--orange)}
  .desc.bad{border-left-color:var(--red)}
  .desc.ok{border-left-color:var(--green)}
  #codeBody{padding:8px 0;font-family:var(--mono);font-size:12px;overflow:auto;flex:1}
  .code-line{display:flex;padding:2px 12px;white-space:pre;min-height:18px;color:#c9d1d9}
  .code-line .ln{width:26px;color:#484f58;user-select:none;text-align:right;margin-right:12px;flex-shrink:0}
  .code-line.cur{background:rgba(56,139,253,.15);border-left:2px solid var(--blue);padding-left:10px}
  .kw{color:#ff7b72}.ty{color:#ffa657}.fn{color:#d2a8ff}.nm{color:#79c0ff}
  @media(max-width:900px){
    body{overflow:auto;height:auto}
    main{grid-template-columns:1fr;overflow:auto}
    .rightCol{overflow:visible}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>155. 最小栈 <span style="color:var(--muted);font-weight:400">| 普通栈 + 辅助最小栈</span></h1>
    <div class="sub">最小栈栈顶始终是当前最小值；getMin 直接看栈顶，O(1)</div>
  </div>
  <div class="controls">
    <div class="seg" id="caseSeg">
      <button data-c="0" class="on">题目示例</button>
      <button data-c="1">重复最小值</button>
      <button data-c="2">增减混合</button>
    </div>
    <button class="btn" id="btnReset">重置</button>
    <button class="btn" id="btnPrev">上一步</button>
    <button class="btn primary" id="btnPlay">播放</button>
    <button class="btn" id="btnNext">下一步</button>
    <select id="speed">
      <option value="1200">慢</option>
      <option value="700" selected>中</option>
      <option value="320">快</option>
    </select>
  </div>
</header>

<div class="progress-bar">
  <span class="pl" id="plLabel">步骤 0 / 0</span>
  <input type="range" id="slider" min="0" max="1" value="0">
</div>

<main>
  <div class="panel">
    <div class="panel-head"><span>两个栈（栈顶在最上方）</span><span id="stepInfo">步骤 0 / 0</span></div>
    <div class="dual">
      <div class="stack-col">
        <div class="stack-name main">Deque&lt;Integer&gt; stack<br>普通栈（全部元素）</div>
        <div class="vstack" id="mainStack"></div>
        <div class="base"></div>
      </div>
      <div class="stack-col">
        <div class="stack-name min">Deque&lt;Integer&gt; minStack<br>辅助最小栈</div>
        <div class="vstack" id="minStack"></div>
        <div class="base"></div>
      </div>
    </div>
  </div>

  <div class="rightCol">
    <div class="panel" style="flex:0 0 auto">
      <div class="panel-head"><span>当前状态</span></div>
      <div class="state-body">
        <div class="meta-grid">
          <div class="meta"><div class="lbl">操作</div><div class="val" id="opVal" style="color:var(--blue)">—</div></div>
          <div class="meta"><div class="lbl">top 栈顶</div><div class="val" id="topVal" style="color:var(--orange)">—</div></div>
          <div class="meta"><div class="lbl">getMin</div><div class="val" id="minVal" style="color:var(--green)">—</div></div>
        </div>
        <div class="desc" id="desc">点击「播放」「下一步」，拖动进度条，或切换上方操作序列。</div>
      </div>
    </div>

    <div class="panel" style="flex:1">
      <div class="panel-head"><span>MinStack.java · 当前执行行高亮</span></div>
      <div id="codeBody"></div>
    </div>
  </div>
</main>

<script>
const CODE = [
 [1 , 'class MinStack {'],
 [2 , '    private Deque<Integer> stack = new ArrayDeque<>();'],
 [3 , '    private Deque<Integer> minStack = new ArrayDeque<>();'],
 [4 , '    public MinStack() {'],
 [5 , '    }'],
 [6 , ''],
 [7 , '    public void push(int val) {'],
 [8 , '        stack.push(val);'],
 [9 , '        if (minStack.isEmpty() || val <= minStack.peek()) {'],
 [10, '            minStack.push(val);'],
 [11, '        }'],
 [12, '    }'],
 [13, ''],
 [14, '    public void pop() {'],
 [15, '        int val = stack.pop();'],
 [16, '        if (val == minStack.peek()) minStack.pop();'],
 [17, '    }'],
 [18, ''],
 [19, '    public int top() {'],
 [20, '        return stack.peek();'],
 [21, '    }'],
 [22, ''],
 [23, '    public int getMin() {'],
 [24, '        return minStack.peek();'],
 [25, '    }'],
 [26, '}'],
];

const OP_CASES = [
  [
    {op:'push',v:-2},{op:'push',v:0},{op:'push',v:-3},
    {op:'getMin'},{op:'pop'},{op:'top'},{op:'getMin'}
  ],
  [
    {op:'push',v:2},{op:'push',v:1},{op:'push',v:1},
    {op:'getMin'},{op:'pop'},{op:'getMin'},{op:'pop'},{op:'getMin'}
  ],
  [
    {op:'push',v:5},{op:'push',v:3},{op:'push',v:4},
    {op:'getMin'},{op:'pop'},{op:'getMin'},{op:'pop'},{op:'getMin'}
  ],
];

function buildSteps(ops){
  const steps=[];
  const stack=[], minStack=[];
  const snap=e=>Object.assign({stack:stack.slice(),minStack:minStack.slice()},e);
  ops.forEach(op=>{
    if(op.op==='push'){
      const v=op.v;
      stack.push(v);
      const curMin = minStack.length?minStack[minStack.length-1]:null;
      const willMin = minStack.length===0 || v<=curMin;
      if(willMin) minStack.push(v);
      steps.push(snap({
        action:'push',v,minChanged:willMin,line:willMin?10:9,
        desc: willMin
          ? `push(${v})：普通栈压入；${v} 不大于当前最小${curMin===null?'（栈空）':' '+curMin}，最小栈也压入 ${v}。`
          : `push(${v})：普通栈压入；${v} 大于最小栈顶 ${curMin}，最小栈保持不动。`,
        descType: willMin?'ok':''
      }));
    } else if(op.op==='pop'){
      const v=stack.pop();
      const curMin=minStack.length?minStack[minStack.length-1]:null;
      const willMin = minStack.length>0 && v===curMin;
      if(willMin) minStack.pop();
      steps.push(snap({
        action:'pop',v,minChanged:willMin,line:16,
        desc: willMin
          ? `pop()：普通栈弹出 ${v}；它正好是最小栈顶，最小栈同步弹出，新最小值变为 ${minStack.length?minStack[minStack.length-1]:'无'}。`
          : `pop()：普通栈弹出 ${v}；它不是最小栈顶 ${curMin}，最小栈不动。`,
        descType: willMin?'warn':''
      }));
    } else if(op.op==='top'){
      const v=stack[stack.length-1];
      steps.push(snap({
        action:'top',result:v,line:20,
        desc:`top()：返回普通栈顶 ${v}，两个栈都不改变。`,
        descType:''
      }));
    } else {
      const v=minStack[minStack.length-1];
      steps.push(snap({
        action:'getMin',result:v,line:24,
        desc:`getMin()：最小栈顶就是当前最小值，直接返回 ${v}，无需遍历，O(1)。`,
        descType:'ok'
      }));
    }
  });
  return steps;
}

let caseIdx=0;
let steps=buildSteps(OP_CASES[0]);
let stepIdx=-1, playing=false, timer=null;

const mainStackEl=document.getElementById('mainStack');
const minStackEl=document.getElementById('minStack');
const codeBody=document.getElementById('codeBody');
const slider=document.getElementById('slider');
const descEl=document.getElementById('desc');

function hl(code){
  return code
    .replace(/\b(class|public|private|void|int|if|return|new)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(Deque|ArrayDeque|Stack|Integer)\b/g,'<span class="ty">$1</span>')
    .replace(/\b(push|pop|peek|isEmpty)\b/g,'<span class="fn">$1</span>')
    .replace(/\b(stack|minStack|val)\b/g,'<span class="nm">$1</span>');
}
function renderCode(curLine){
  codeBody.innerHTML = CODE.map(([n,t])=>
    `<div class="code-line${n===curLine?' cur':''}"><span class="ln">${n}</span><span>${hl(t)||'&nbsp;'}</span></div>`
  ).join('');
}
function renderStack(el, arr, kind, showGhost, ghostV){
  let h='';
  if(showGhost) h += `<div class="ghost">${ghostV}</div>`;
  h += [...arr].reverse().map((v,revIdx)=>{
    const realIdx=arr.length-1-revIdx;
    const isTop=realIdx===arr.length-1?' is-top':'';
    return `<div class="cell ${kind}${isTop}">${v}</div>`;
  }).join('');
  el.innerHTML=h;
}

function render(){
  const s=stepIdx>=0?steps[stepIdx]:null;
  const m=s?s.stack:[];
  const z=s?s.minStack:[];

  const mainGhost = s && s.action==='pop';
  const minGhost = s && s.action==='pop' && s.minChanged;
  renderStack(mainStackEl,m,'main',mainGhost,s?s.v:null);
  renderStack(minStackEl,z,'min',minGhost,s?s.v:null);

  document.getElementById('opVal').textContent = s
    ? (s.action+(s.action==='push'?'('+s.v+')':s.action==='pop'?'()':'()')) : '—';
  document.getElementById('topVal').textContent = m.length?m[m.length-1]:'—';
  document.getElementById('minVal').textContent = z.length?z[z.length-1]:'—';

  if(s){
    descEl.textContent=s.desc;
    descEl.className='desc '+(s.descType||'');
    renderCode(s.line);
  } else {
    descEl.textContent='点击「播放」「下一步」，拖动进度条，或切换上方操作序列。';
    descEl.className='desc';renderCode(0);
  }
  document.getElementById('stepInfo').textContent=`步骤 ${Math.max(stepIdx+1,0)} / ${steps.length}`;
  slider.max=Math.max(steps.length-1,0);
  slider.value=Math.max(stepIdx,0);
  document.getElementById('plLabel').textContent=`步骤 ${Math.max(stepIdx+1,0)} / ${steps.length}`;
}

function next(){if(stepIdx<steps.length-1){stepIdx++;render();return true;}return false;}
function prev(){if(stepIdx>-1){stepIdx--;render();}}
function stop(){playing=false;if(timer){clearInterval(timer);timer=null;}document.getElementById('btnPlay').textContent='播放';}
function play(){
  if(playing){stop();return;}
  playing=true;document.getElementById('btnPlay').textContent='暂停';
  if(stepIdx>=steps.length-1){stepIdx=-1;render();}
  timer=setInterval(()=>{if(!next())stop();},Number(document.getElementById('speed').value));
}
function reset(){stop();stepIdx=-1;render();}

document.getElementById('btnPlay').addEventListener('click',play);
document.getElementById('btnNext').addEventListener('click',()=>{stop();next();});
document.getElementById('btnPrev').addEventListener('click',()=>{stop();prev();});
document.getElementById('btnReset').addEventListener('click',reset);
slider.addEventListener('input',()=>{stop();stepIdx=Number(slider.value);render();});
document.getElementById('caseSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#caseSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');caseIdx=Number(b.dataset.c);
  steps=buildSteps(OP_CASES[caseIdx]);
  stop();stepIdx=-1;render();
});
document.getElementById('speed').addEventListener('change',()=>{if(playing){stop();play();}});
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();play();}
  else if(e.code==='ArrowRight'){e.preventDefault();stop();next();}
  else if(e.code==='ArrowLeft'){e.preventDefault();stop();prev();}
});

render();
</script>
</body>
</html>
