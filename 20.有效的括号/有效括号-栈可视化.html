<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='18' font-size='18'>()</text></svg>">
<title>20. 有效的括号 · 栈可视化</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e;
    --blue:#58a6ff; --green:#3fb950; --orange:#d29922; --red:#f85149; --purple:#bc8cff;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:14px;line-height:1.6;overflow:hidden;height:100vh;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;
  }
  h1{font-size:18px}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{background:var(--bg);color:var(--muted);border:none;padding:7px 11px;cursor:pointer;font-family:var(--mono);font-size:11.5px}
  .seg button.on{background:var(--blue);color:#fff}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .btn:hover{background:#272e3a}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 6px;font-size:12px}
  .progress-bar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
  .pl{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  input[type=range]{flex:1;accent-color:var(--blue)}
  main{flex:1;display:grid;grid-template-columns:1fr 1.1fr;gap:14px;padding:14px 20px;overflow:hidden}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;font-family:var(--mono);color:var(--muted)}
  .left-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
  .stack-lbl{font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:7px}
  .input-str{display:flex;gap:5px;flex-wrap:wrap}
  .ch-box{font-family:var(--mono);font-size:15px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
  .ch-box.done{color:var(--fg);border-color:var(--border)}
  .ch-box.scan{background:rgba(31,111,235,.25);border-color:var(--blue);color:var(--blue);font-weight:700}
  .ch-box.pair{background:rgba(63,185,80,.28);border-color:var(--green);color:var(--green);font-weight:700}
  .ch-box.pair-bad{background:rgba(248,81,73,.28);border-color:var(--red);color:var(--red);font-weight:700}
  .ch-box{cursor:pointer}
  .ch-box:hover{border-color:var(--blue)}
  .stack-area{display:flex;flex-direction:column}
  .stack{display:flex;flex-direction:column-reverse;gap:6px;align-items:center}
  .st-item{font-family:var(--mono);font-size:16px;width:54px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:var(--panel2);animation:pop .25s ease}
  .st-item.top{font-weight:700}
  .st-item.t-round{color:var(--blue);border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.12)}
  .st-item.t-curly{color:var(--orange);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.12)}
  .st-item.t-square{color:var(--purple);border-color:rgba(188,140,255,.5);background:rgba(188,140,255,.12)}
  .st-ghost{font-family:var(--mono);font-size:16px;width:54px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px dashed var(--red);color:var(--red);opacity:.6;animation:ghost .5s ease}
  .stack-base{width:70px;height:5px;background:var(--border);border-radius:3px;margin:8px auto 0}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes ghost{from{opacity:0;transform:translateY(8px)}to{opacity:.6;transform:translateY(0)}}
  .rightCol{display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .state-body{padding:13px 14px;display:flex;flex-direction:column;gap:11px}
  .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .meta{background:var(--panel2);border-radius:6px;padding:8px 6px;text-align:center;border:1px solid var(--border)}
  .meta .lbl{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .meta .val{font-size:14px;font-weight:700;font-family:var(--mono);margin-top:3px}
  .verdict{padding:9px 12px;border-radius:6px;font-size:13px;font-weight:600;text-align:center;border:1px solid var(--border)}
  .verdict.ok{background:rgba(63,185,80,.15);color:var(--green);border-color:rgba(63,185,80,.5)}
  .verdict.bad{background:rgba(248,81,73,.15);color:var(--red);border-color:rgba(248,81,73,.5)}
  .verdict.idle{color:var(--muted);background:var(--panel2)}
  .desc{background:var(--panel2);padding:9px 11px;border-radius:6px;border-left:3px solid var(--blue);font-size:12.5px;line-height:1.6}
  .desc.warn{border-left-color:var(--orange)}
  .desc.bad{border-left-color:var(--red)}
  .desc.ok{border-left-color:var(--green)}
  #codeBody{padding:8px 0;font-family:var(--mono);font-size:12px;overflow:auto;flex:1}
  .code-line{display:flex;padding:2px 12px;white-space:pre;min-height:18px;color:#c9d1d9}
  .code-line .ln{width:26px;color:#484f58;user-select:none;text-align:right;margin-right:12px;flex-shrink:0}
  .code-line.cur{background:rgba(56,139,253,.15);border-left:2px solid var(--blue);padding-left:10px}
  .kw{color:#ff7b72}.ty{color:#ffa657}.fn{color:#d2a8ff}.nm{color:#79c0ff}.bo{color:#79c0ff}
  @media(max-width:900px){
    body{overflow:auto;height:auto}
    main{grid-template-columns:1fr;overflow:auto}
    .rightCol{overflow:visible}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>20. 有效的括号 <span style="color:var(--muted);font-weight:400">| 栈 · 压期望右括号匹配</span></h1>
    <div class="sub">左括号压入对应右括号；右括号与栈顶匹配则弹出，否则无效</div>
  </div>
  <div class="controls">
    <div class="seg" id="caseSeg">
      <button data-c="()[]{}" class="on">()[]{}</button>
      <button data-c="{[]}">{[]}</button>
      <button data-c="(]">(]</button>
      <button data-c="([)]">([)]</button>
      <button data-c="(((">(((</button>
    </div>
    <button class="btn" id="btnReset">重置</button>
    <button class="btn" id="btnPrev">上一步</button>
    <button class="btn primary" id="btnPlay">播放</button>
    <button class="btn" id="btnNext">下一步</button>
    <select id="speed">
      <option value="1200">慢</option>
      <option value="700" selected>中</option>
      <option value="320">快</option>
    </select>
  </div>
</header>

<div class="progress-bar">
  <span class="pl" id="plLabel">步骤 0 / 0</span>
  <input type="range" id="slider" min="0" max="1" value="0">
</div>

<main>
  <div class="panel">
    <div class="panel-head"><span>栈（栈顶在最上方）</span></div>
    <div class="left-body">
      <div>
        <div class="stack-lbl">输入字符串（蓝色=当前扫描）</div>
        <div class="input-str" id="inputStr"></div>
      </div>
      <div class="stack-area">
        <div class="stack-lbl">Deque&lt;Character&gt;（装的是期望右括号）</div>
        <div class="stack" id="stack"></div>
        <div class="stack-base"></div>
      </div>
    </div>
  </div>

  <div class="rightCol">
    <div class="panel" style="flex:0 0 auto">
      <div class="panel-head"><span>当前状态</span><span id="stepInfo">步骤 0 / 0</span></div>
      <div class="state-body">
        <div class="meta-grid">
          <div class="meta"><div class="lbl">当前字符</div><div class="val" id="cVal" style="color:var(--blue)">—</div></div>
          <div class="meta"><div class="lbl">栈顶</div><div class="val" id="topVal" style="color:var(--orange)">—</div></div>
          <div class="meta"><div class="lbl">栈大小</div><div class="val" id="sizeVal" style="color:var(--purple)">0</div></div>
        </div>
        <div class="verdict idle" id="verdict">等待开始</div>
        <div class="desc" id="desc">点击「播放」「下一步」，拖动进度条，或切换上方用例。</div>
      </div>
    </div>

    <div class="panel" style="flex:1">
      <div class="panel-head"><span>Solution.java · 当前执行行高亮</span></div>
      <div id="codeBody"></div>
    </div>
  </div>
</main>

<script>
const CODE = [
 [1 , 'class Solution {'],
 [2 , '    public boolean isValid(String s) {'],
 [3 , '        if (s.length() % 2 != 0) return false;'],
 [4 , '        Deque<Character> stack = new ArrayDeque<>();'],
 [5 , ''],
 [6 , '        for (int i = 0; i < s.length(); i++) {'],
 [7 , '            char c = s.charAt(i);'],
 [8 , "            if (c == '(') {"],
 [9 , "                stack.push(')');"],
 [10, "            } else if (c == '{') {"],
 [11, "                stack.push('}');"],
 [12, "            } else if (c == '[') {"],
 [13, "                stack.push(']');"],
 [14, '            } else {'],
 [15, '                if (stack.isEmpty() || c != stack.pop()) {'],
 [16, '                    return false;'],
 [17, '                }'],
 [18, '            }'],
 [19, '        }'],
 [20, '        return stack.isEmpty();'],
 [21, '    }'],
 [22, '}'],
];

const expectMap = { '(':')', '{':'}', '[':']' };
const openSet = new Set(['(','{','[']);
function typeOf(v){
  if(v===')'||v==='(') return 't-round';
  if(v==='}'||v==='{') return 't-curly';
  return 't-square';
}

function buildSteps(s){
  const steps = [];
  const stack = [];
  const openPos = [];   // 与栈并行，记录每个左括号在输入串中的位置
  function snap(extra){
    return Object.assign({ stack: stack.slice() }, extra);
  }
  if(s.length % 2 !== 0){
    steps.push(snap({
      action:'oddFail', i:-1, line:3,
      desc:`长度 ${s.length} 是奇数，括号不可能成对，第一行直接返回 false。`,
      descType:'bad', verdict:false
    }));
    return steps;
  }
  for(let idx=0; idx<s.length; idx++){
    const c = s[idx];
    if(openSet.has(c)){
      const e = expectMap[c];
      const line = c==='('?9 : c==='{'?11 : 13;
      stack.push(e);
      openPos.push(idx);
      steps.push(snap({
        action:'push', i:idx, c, line,
        desc:`左括号 '${c}'，压入它期望的右括号 '${e}'，等后面遇到相同类型的右括号来匹配。`,
        descType:'', verdict:null
      }));
    } else {
      if(stack.length===0){
        steps.push(snap({
          action:'emptyFail', i:idx, c, line:15,
          desc:`遇到右括号 '${c}'，但栈已空，没有左括号能匹配，stack.isEmpty() 成立，返回 false。`,
          descType:'bad', verdict:false
        }));
        return steps;
      }
      const top = stack[stack.length-1];
      const openIdx = openPos[openPos.length-1];
      if(top !== c){
        steps.push(snap({
          action:'mismatch', i:idx, c, line:15, popped:top, matchOpen:openIdx,
          desc:`栈顶是 '${top}'，与当前右括号 '${c}' 类型不匹配，c != stack.pop() 成立，返回 false。`,
          descType:'bad', verdict:false
        }));
        return steps;
      }
      openPos.pop();
      stack.pop();
      steps.push(snap({
        action:'match', i:idx, c, line:15, popped:top, matchOpen:openIdx,
        desc:`栈顶 '${top}' 与当前 '${c}' 匹配，执行 pop 弹出，配对的两个括号高亮，继续扫描。`,
        descType:'ok', verdict:null
      }));
    }
  }
  if(stack.length===0){
    steps.push(snap({
      action:'valid', i:s.length, line:20,
      desc:'遍历结束，栈为空，所有括号都正确匹配，stack.isEmpty() 为 true，返回 true。',
      descType:'ok', verdict:true
    }));
  } else {
    steps.push(snap({
      action:'leftFail', i:s.length, line:20,
      desc:`遍历结束，但栈里还剩 ${stack.length} 个未匹配的右括号，stack.isEmpty() 为 false，返回 false。`,
      descType:'bad', verdict:false
    }));
  }
  return steps;
}

let currentCase = '()[]{}';
let steps = buildSteps(currentCase);
let stepIdx = -1;
let playing = false;
let timer = null;

const inputStrEl = document.getElementById('inputStr');
const stackEl = document.getElementById('stack');
const codeBody = document.getElementById('codeBody');
const slider = document.getElementById('slider');
const descEl = document.getElementById('desc');

function hl(code){
  return code
    .replace(/\b(class|public|boolean|int|if|else|return|new|char)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(Deque|ArrayDeque|Stack|Character|String)\b/g,'<span class="ty">$1</span>')
    .replace(/\b(isValid|push|pop|isEmpty|length|charAt|toCharArray)\b/g,'<span class="fn">$1</span>')
    .replace(/\b(stack|s|i)\b/g,'<span class="nm">$1</span>');
}
function renderCode(curLine){
  codeBody.innerHTML = CODE.map(([n,t])=>
    `<div class="code-line${n===curLine?' cur':''}"><span class="ln">${n}</span><span>${hl(t)||'&nbsp;'}</span></div>`
  ).join('');
}

function render(){
  const s = stepIdx>=0 ? steps[stepIdx] : null;
  const st = s ? s.stack : [];
  const scanI = s ? s.i : -1;

  const isPairStep = s && (s.action==='match'||s.action==='mismatch');
  const pairPositions = isPairStep ? [s.matchOpen, scanI] : [];
  const pairCls = s && s.action==='match' ? 'pair' : 'pair-bad';
  inputStrEl.innerHTML = [...currentCase].map((c,idx)=>{
    let cls='ch-box';
    if(idx===scanI) cls+=' scan';
    else if(idx<scanI) cls+=' done';
    if(pairPositions.includes(idx)) cls+=' '+pairCls;
    return `<span class="${cls}" data-idx="${idx}">${c}</span>`;
  }).join('');

  let html = [...st].reverse().map((v,revIdx)=>{
    const realIdx = st.length-1-revIdx;
    const top = realIdx===st.length-1 ? ' top':'';
    return `<div class="st-item ${typeOf(v)}${top}">${v}</div>`;
  }).join('');
  if(s && s.popped!==undefined){
    html = `<div class="st-ghost">${s.popped}</div>` + html;
  }
  stackEl.innerHTML = html || '';

  document.getElementById('cVal').textContent = s && s.c ? s.c : '—';
  document.getElementById('topVal').textContent = st.length ? st[st.length-1] : '—';
  document.getElementById('sizeVal').textContent = st.length;

  const verdictEl = document.getElementById('verdict');
  if(s && s.verdict===true){
    verdictEl.className='verdict ok'; verdictEl.textContent='有效 → true';
  } else if(s && s.verdict===false){
    verdictEl.className='verdict bad'; verdictEl.textContent='无效 → false';
  } else {
    verdictEl.className='verdict idle'; verdictEl.textContent = s ? '判断中…' : '等待开始';
  }

  if(s){
    descEl.textContent = s.desc;
    descEl.className = 'desc '+(s.descType||'');
    renderCode(s.line);
  } else {
    descEl.textContent = '点击「播放」「下一步」，拖动进度条，或切换上方用例。';
    descEl.className='desc'; renderCode(0);
  }
  document.getElementById('stepInfo').textContent = `步骤 ${Math.max(stepIdx+1,0)} / ${steps.length}`;
  slider.max = Math.max(steps.length-1,0);
  slider.value = Math.max(stepIdx,0);
  document.getElementById('plLabel').textContent = `步骤 ${Math.max(stepIdx+1,0)} / ${steps.length}`;
}

function next(){
  if(stepIdx < steps.length-1){ stepIdx++; render(); return true; }
  return false;
}
function prev(){ if(stepIdx>-1){ stepIdx--; render(); } }
function stop(){
  playing=false;
  if(timer){clearInterval(timer);timer=null;}
  document.getElementById('btnPlay').textContent='播放';
}
function play(){
  if(playing){ stop(); return; }
  playing=true;
  document.getElementById('btnPlay').textContent='暂停';
  if(stepIdx>=steps.length-1){ stepIdx=-1; render(); }
  const speed = Number(document.getElementById('speed').value);
  timer = setInterval(()=>{ if(!next()) stop(); }, speed);
}
function reset(){
  stop(); stepIdx=-1; render();
}

document.getElementById('btnPlay').addEventListener('click',play);
document.getElementById('btnNext').addEventListener('click',()=>{stop();next();});
document.getElementById('btnPrev').addEventListener('click',()=>{stop();prev();});
document.getElementById('btnReset').addEventListener('click',reset);
slider.addEventListener('input',()=>{stop();stepIdx=Number(slider.value);render();});
document.getElementById('caseSeg').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#caseSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  currentCase = b.dataset.c;
  steps = buildSteps(currentCase);
  stop(); stepIdx=-1; render();
});
document.getElementById('speed').addEventListener('change',()=>{ if(playing){stop();play();} });

// 点击输入串字符，跳转到该字符首次被扫描的步骤
inputStrEl.addEventListener('click',e=>{
  const box = e.target.closest('.ch-box'); if(!box) return;
  const idx = Number(box.dataset.idx);
  const target = steps.findIndex(st=>st.i===idx);
  if(target>=0){ stop(); stepIdx=target; render(); }
});

// 键盘快捷键：空格播放/暂停，左右方向键单步
document.addEventListener('keydown',e=>{
  const tag = e.target.tagName;
  if(tag==='INPUT' && e.target.type!=='range') return;
  if(e.code==='Space'){ e.preventDefault(); play(); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); stop(); next(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); stop(); prev(); }
});

render();
</script>
</body>
</html>
